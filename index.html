<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>资产驾驶舱</title>
<style>
  :root{
    --bg:#f2f3f5; --card:#ffffff; --ink:#2e333d; --ink-2:#5d6675; --ink-faint:#9aa1b0;
    --line:#e2e5ea; --pos:#1a7f37; --neg:#c9314a; --radius:16px;

    /* 每大类：主色(icon/强调) + 浅底 + 边框。文字统一深色 */
    --stock:#2f6fed;  --stock-bg:#e8f0fe;  --stock-ln:#c7dbfb;  --stock-head:#f0f5ff;  /* 更浅的蓝·标题 */
    --grphead-bg:#f0f1f3;  /* 浅灰色·大类标题底 */
    --cd:#9333ea;     --cd-bg:#f3e9fd;     --cd-ln:#e3cdfa;
    --bond:#c2820a;   --bond-bg:#fbf1d9;   --bond-ln:#f2e0af;
    --cash:#7C9070;   --cash-bg:#D2E7D3;   --cash-ln:#c2ecd1;
    --retire:#4A90A4; --retire-bg:#D8E6EA; --retire-ln:#b6e9e3;
    --hsa:#e0692f; --hsa-bg:#fcece2; --hsa-ln:#f7d2bd;
    --prop:#db2777;   --prop-bg:#fce7f1;   --prop-ln:#f8cbdf;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
  .screen{position:absolute;inset:0;min-height:100%;
    padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 40px);
    max-width:520px;margin:0 auto;left:0;right:0;
    opacity:0;transform:translateX(24px);pointer-events:none;
    transition:opacity .22s ease,transform .22s ease;}
  .screen.active{opacity:1;transform:none;pointer-events:auto;position:relative;}
  .nav{display:flex;align-items:center;gap:10px;margin:6px 2px 18px;min-height:28px;}
  .nav .back{display:flex;align-items:center;gap:4px;font-size:15px;
    background:none;border:none;cursor:pointer;padding:4px 6px 4px 0;font-weight:500;}
  .nav .title{font-size:15px;font-weight:600;flex:1;}
  header{display:flex;justify-content:space-between;align-items:baseline;margin:8px 2px 20px;}
  header h1{font-size:15px;font-weight:600;letter-spacing:.01em;}
  header .date{font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
  .hero{margin:0 2px 22px;}
  .hero .label{font-size:12px;color:var(--ink-2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;font-weight:500;}
  .hero .value{font-size:40px;font-weight:600;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink-2);}
  .hero .value .cur{font-size:20px;color:var(--ink-faint);font-weight:500;margin-right:4px;vertical-align:6px;}
  .hero .sub{margin-top:8px;font-size:13px;color:var(--ink-2);}
  .allocbar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:6px 2px 20px;gap:2px;}
  .allocbar span{display:block;height:100%;}
  .classlist{display:flex;flex-direction:column;gap:11px;margin-bottom:18px;}
  .ccard{display:flex;align-items:center;gap:12px;border-radius:var(--radius);
    padding:15px 16px;cursor:pointer;transition:filter .12s,transform .1s;}
  .ccard:active{filter:brightness(.97);transform:scale(.995);}
  .ccard .cbar{width:4px;align-self:stretch;border-radius:3px;flex:none;}
  .ccard .mid{flex:1;}
  .ccard .nm{font-size:15px;font-weight:600;color:var(--ink);}
  .ccard .meta{font-size:12px;color:var(--ink-2);margin-top:2px;}
  .ccard .amt{text-align:right;}
  .ccard .amt .mv{font-size:15px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;}
  .ccard .amt .pc{font-size:12px;color:var(--ink-2);margin-top:2px;font-variant-numeric:tabular-nums;font-weight:500;}
  .ccard .chev{font-size:16px;font-weight:500;margin-left:2px;}
  .gauge{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:22px;}
  .gauge .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
  .gauge .top .t{font-size:13px;color:var(--ink-2);font-weight:500;}
  .gauge .top .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;}
  .gauge .track{position:relative;height:8px;background:#eceef2;border-radius:4px;overflow:hidden;}
  .gauge .fill{position:absolute;left:0;top:0;height:100%;border-radius:4px;transition:width .4s;}
  .gauge .marks{position:relative;height:16px;margin-top:6px;}
  .gauge .mark{position:absolute;top:0;transform:translateX(-50%);font-size:10px;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
  .gauge .mark::before{content:"";position:absolute;top:-8px;left:50%;width:1px;height:5px;background:#c8cdd6;}
  .gauge .note{margin-top:12px;font-size:12px;color:var(--ink-2);line-height:1.5;}
  .dhero{border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  .dhero.dark{background:var(--card);border-width:1px 1px 1px 4px;}
  .dhero.dark .v{color:var(--ink-2);}
  .dhero.dark .v .cur{color:var(--ink-faint);}
  .dhero.dark .s{color:var(--ink-2);}
  .dhero .l{font-size:12px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px;font-weight:600;}
  .dhero .v{font-size:32px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink-2);}
  .dhero .v .cur{font-size:16px;color:var(--ink-faint);margin-right:3px;vertical-align:4px;}
  .dhero .s{font-size:12px;color:var(--ink-2);margin-top:6px;font-weight:500;}
  .group{border:1px solid var(--stock-ln);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;}
  .grp-head{display:flex;align-items:center;gap:10px;padding:12px 15px;background:var(--grphead-bg);border-bottom:1px solid var(--stock-ln);}
  .grp-head .cat{flex:1;font-size:13px;font-weight:600;color:var(--ink);}
  .grp-head .cat .sub{display:block;font-size:11px;color:var(--ink-faint);font-weight:400;margin-top:2px;}
  .grp-head .gpc{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;}
  .row{display:flex;align-items:center;padding:12px 14px;border-top:1px solid var(--line);}
  .row:first-child{border-top:none;}
  .row .tk{flex:none;width:72px;}
  .row .tk .sym{font-size:14px;font-weight:600;color:var(--ink);}
  .row .tk .qty{font-size:11px;color:var(--ink-faint);margin-top:1px;font-variant-numeric:tabular-nums;font-weight:400;}
  .row .desc{flex:1;font-size:11px;color:var(--ink-2);padding:0 8px;line-height:1.3;}
  .row .val{text-align:right;flex:none;}
  .row .val .mv{font-size:14px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;}
  .row .val .pc{font-size:11px;color:var(--ink-faint);margin-top:1px;font-variant-numeric:tabular-nums;font-weight:400;}
  .placeholder{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
    padding:20px;text-align:center;color:var(--ink-2);font-size:13px;line-height:1.6;margin-top:8px;}
  .placeholder b{color:var(--ink);font-weight:600;}

  /* add / edit form */
  .addbox{border:1px dashed var(--cd-ln);background:var(--cd-bg);border-radius:var(--radius);
    padding:16px;text-align:center;cursor:pointer;transition:filter .12s;margin-top:4px;}
  .addbox:active{filter:brightness(.97);}
  .addbox .plus{font-size:22px;font-weight:400;color:var(--cd);line-height:1;}
  .addbox .lbl{font-size:12px;color:var(--ink-2);margin-top:4px;}
  .editform{border:1px solid var(--cd-ln);background:var(--card);border-radius:var(--radius);
    padding:16px;margin-top:4px;}
  .editform .fld{margin-bottom:12px;}
  .editform label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:5px;font-weight:500;}
  .editform input{width:100%;border:1px solid var(--line);border-radius:10px;background:#fafbfc;
    padding:11px 12px;font-size:15px;color:var(--ink);font-family:inherit;
    font-variant-numeric:tabular-nums;-webkit-appearance:none;}
  .editform input:focus{outline:none;border-color:var(--cd);background:#fff;}
  .editform .btns{display:flex;gap:10px;margin-top:6px;}
  .editform button{flex:1;border:none;border-radius:10px;padding:12px;font-size:14px;
    font-weight:600;font-family:inherit;cursor:pointer;}
  .editform .save{background:var(--cd);color:#fff !important;border-radius:12px;}
  .editform .cancel{background:#eceef2;color:var(--ink-2);}

  /* swipe-to-delete row */
  .swipe{position:relative;overflow:hidden;}
  .swipe-del{position:absolute;top:0;right:0;height:100%;width:76px;background:var(--neg);
    color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;
    cursor:pointer;z-index:0;}
  .swipe-row{position:relative;z-index:1;background:var(--cd-bg);transition:transform .18s ease;
    will-change:transform;}
  .swipe.open .swipe-row{transform:translateX(-76px);}

  /* 股票成本/利润列 */
  .row .scost{flex:none;width:88px;text-align:right;padding-right:0;margin-left:auto;}
  .row .scost .ac{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:500;}
  .row .scost .pr{font-size:11px;margin-top:1px;font-variant-numeric:tabular-nums;font-weight:600;}
  .row .val{min-width:92px;margin-left:18px;}
  .stock-slot:empty{display:none;}
  .stock-slot .editform{margin:2px 0 10px;}

  /* 转账按钮 */
  .cashrow{display:flex;gap:10px;align-items:stretch;margin-bottom:18px;}
  .cashrow .ccard{flex:1;margin-bottom:0;}
  .xfer-btn{flex:none;width:66px;border-radius:var(--radius);border:none;cursor:pointer;
    background:#B6A9C8;color:var(--ink);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3px;font-weight:600;box-shadow:0 2px 8px rgba(182,169,200,.35);
    transition:transform .1s;}
  .xfer-btn:active{transform:scale(.96);}
  .xfer-btn .ic{font-size:15px;line-height:1;color:#EFE4D4;}
  .xfer-btn .tx{font-size:15px;color:#EFE4D4;}

  /* 现金 收入/支出 tab */
  .cashtabs{display:flex;gap:8px;margin:16px 2px 12px;}
  .cashtab{flex:1;text-align:center;padding:11px;border-radius:12px;font-size:14px;font-weight:600;
    cursor:pointer;border:none;background:var(--card);color:var(--ink-2);transition:all .15s;}
  .cashtab.on-in{background:#EBEDE8;border:none;color:#4F5D7A;}
  .cashtab.on-ex{background:#F8CCD8;border:none;color:#B86A78;}
  /* 支出方块网格 */
  .expgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px;}
  .expcell{border:none;border-radius:14px;padding:11px 10px;}
  .expcell .nm{font-size:12px;font-weight:600;color:var(--ink);line-height:1.25;min-height:30px;}
  .expcell .amt{font-size:17px;font-weight:650;color:var(--ink);margin-top:4px;font-variant-numeric:tabular-nums;}
  .expcell .pc{font-size:10px;color:var(--ink-faint);margin-top:2px;font-variant-numeric:tabular-nums;}
  .expcell.exptotal{grid-column:span 2;background:#fbf1d9;border:none;display:flex;flex-direction:column;justify-content:center;}
  .expcell.exptotal .amt{font-size:20px;}

  /* 国债利息弹窗 */
  .imodal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;}
  .imodal{background:var(--card);border-radius:20px;padding:22px 20px;max-width:340px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.2);}
  .imodal h3{margin:0 0 6px;font-size:17px;color:var(--ink);}
  .imodal p{margin:0 0 16px;font-size:14px;color:var(--ink-2);line-height:1.5;}
  .imodal .amt-big{font-size:24px;font-weight:700;color:var(--bond);margin:8px 0 14px;}
  .imodal .choice{display:flex;gap:10px;}
  .imodal .choice button{flex:1;padding:13px;border:none;border-radius:12px;font-size:15px;font-weight:600;
    font-family:inherit;cursor:pointer;color:#fff;}

  /* ===== 详情页大类卡片（干净版，仿主页风格）===== */
  .stkgroup{border:1px solid var(--stock-ln);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;}
  .stkgroup-head{display:flex;align-items:center;gap:10px;padding:12px 14px;}
  .stkbar{width:4px;align-self:stretch;border-radius:3px;flex:none;min-height:20px;}
  .stkcat{flex:1;font-size:14px;font-weight:600;color:var(--ink);}
  .stkcat .stksub{display:block;font-size:11px;color:var(--ink-faint);font-weight:400;margin-top:2px;}
  .stkpc{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
  .stkrows .row{background:#F8FAFC;border-top:1px solid rgba(0,0,0,.05);padding:9px 14px;}
  .stkrows .swipe-row{background:transparent;}
  .foot{text-align:center;font-size:11px;color:var(--ink-faint);margin-top:24px;line-height:1.6;}
  .foot .badge{display:inline-block;background:#e6e9ee;border:1px solid var(--line);border-radius:6px;
    padding:3px 8px;color:var(--ink-2);margin-bottom:8px;font-variant-numeric:tabular-nums;font-weight:400;}
</style>
</head>
<body>
<div id="bondModalMount"></div>

<div class="screen active" id="scr-overview">
  <header>
    <h1>资产驾驶舱</h1>
    <span class="date num" id="asof">—</span>
  </header>
  <div class="hero">
    <div class="label">投资资产总额 · 不含房产、退休金</div>
    <div class="value num"><span class="cur">$</span><span id="total">—</span></div>
    <div class="sub"></div>
  </div>
  <div class="allocbar" id="allocbar"></div>
  <div class="classlist" id="classlist"></div>
  <div id="propslot"></div>
  <div class="gauge">
    <div class="top">
      <span class="t">半导体集中度 · 占股票类</span>
      <span class="v num" id="semiPc">—</span>
    </div>
    <div class="track"><div class="fill" id="semiFill"></div></div>
    <div class="marks">
      <span class="mark" style="left:25%">健康 20%</span>
      <span class="mark" style="left:50%">偏高 40%</span>
      <span class="mark" style="left:75%">过高 60%</span>
    </div>
    <div class="note" id="semiNote"></div>
  </div>
  <div class="foot">
    <div class="badge">初始版本 · 数据写死于 2026-07-31</div><br>
    点击任意大类查看明细 · 下一步接 Google Sheet
  </div>
</div>

<div class="screen" id="scr-detail">
  <div class="nav">
    <button class="back" id="d-back" onclick="go('overview')">&lsaquo; 总览</button>
    <span class="title" id="d-title">—</span>
  </div>
  <div id="d-body"></div>
</div>

<div class="screen" id="scr-property">
  <div class="nav">
    <button class="back" style="color:var(--prop)" onclick="go('overview')">&lsaquo; 总览</button>
    <span class="title">房产</span>
  </div>
  <div id="prop-body"></div>
</div>

<div class="screen" id="scr-transfer">
  <div class="nav">
    <button class="back" style="color:var(--cash)" onclick="go('overview')">&lsaquo; 总览</button>
    <span class="title">转账</span>
  </div>
  <div id="transfer-body"></div>
</div>

<script>
const ASOF = new Date().toISOString().slice(0,10);
const DATA = {
  stock: {
    name:"\u80a1\u7968", color:"var(--stock)", key:"stock", meta:"Webull \u00b7 \u542b\u73b0\u91d1/BTC/RSU",
    groups:[]  // 初始为空，启动时由 localStorage 或 Google Sheet 填充（见 syncStockFromSheet）
  },
  cd: {
    name:"\u50a8\u84c4", color:"var(--cd)", key:"cd", meta:"Marcus \u00b7 \u5b9a\u5b58+\u6d3b\u671f",
    groups:[ { cat:"\u5b9a\u671f\u5b58\u5355", sub:"", holdings:[
      {sym:"CD-7597", rate:4.0, mat:"2027-06-30", baseMv:21264, updated:"2026-07-31"},
      {sym:"CD-9185", rate:4.1, mat:"2027-02-05", baseMv:10239, updated:"2026-07-31"},
      {sym:"OS-9250", rate:3.4, mat:"", baseMv:41000, updated:"2026-08-01"},
    ]}]
  },
  bond: {
    name:"\u56fd\u503a", color:"var(--bond)", key:"bond", meta:"TreasuryDirect \u00b7 \u5747 3.98%",
    groups:[ { cat:"\u7f8e\u56fd\u56fd\u503a", sub:"", holdings:[
      {sym:"T-Notes", rate:3.75, mat:"2027-08-15", baseMv:10000, updated:"2026-07-31"},
      {sym:"I Bond",  rate:4.26, mat:"2056-01-01", baseMv:8000,  updated:"2026-07-31"},
    ]}]
  },
  cash: {
    name:"\u73b0\u91d1", color:"var(--cash)", key:"cash", meta:"",
    groups:[ { cat:"\u64cd\u4f5c\u8d26\u6237", sub:"", holdings:[
      {sym:"Chase",  qty:"~0%",   desc:"\u65e5\u5e38\u64cd\u4f5c\u8d26\u6237", mv:10000},
    ]}],
    ledger:true
  },
  retire: {
    name:"\u9000\u4f11", color:"var(--retire)", key:"retire", meta:"\u7a0e\u4f18\u00b7\u957f\u671f",
    groups:[ { cat:"\u7a0e\u4f18\u8d26\u6237", sub:"", holdings:[
      {sym:"401k", desc:"\u81ea\u52a8\u589e\u957f", baseMv:102000, updated:"2026-08-01",
        empCon:905, erCon:271, rate:15, growth:true},
      {sym:"Roth IRA", qty:"\u2014", desc:"QQQM\u00b7SMH\u00b7SPAXX", mv:7515},
    ]}]
  },
  hsa: {
    name:"HSA", color:"var(--hsa)", key:"hsa", meta:"\u533b\u7597\u50a8\u84c4\u00b7\u53cc\u91cd\u514d\u7a0e",
    groups:[ { cat:"HSA \u8d26\u6237", sub:"", holdings:[
      {sym:"Investment", qty:"\u2014", desc:"\u57fa\u91d1\u6295\u8d44\u00b7\u957f\u671f\u514d\u7a0e", mv:3458},
      {sym:"Cash",       qty:"\u2014", desc:"\u53ef\u62a5\u9500\u533b\u7597\u652f\u51fa", mv:2500},
    ]}]
  },
};
const PROPERTY = {
  value:415000,      // 房价估值
  loan:263000,       // 当前贷款余额（起点）
  origLoan:315000,   // 原始贷款额
  rate:5.124,        // 年利率 %
  termYears:30,      // 原始期限
  payment:2025,      // 标准月供
  extra:600,         // 每月额外还本金（可编辑）
  updated:"2026-08-01" // 余额起点日期
};
// 从 localStorage 读取用户对 PROPERTY 的修改
try{ const sp=JSON.parse(localStorage.getItem('property_v1')||'null'); if(sp) Object.assign(PROPERTY,sp); }catch(e){}
function persistProp(){ localStorage.setItem('property_v1', JSON.stringify(PROPERTY)); }

// 按经过月数摊销：每月 利息=余额×月利率，本金=(月供-利息)+额外，余额-=本金
function amortizeNow(){
  const monthlyRate = PROPERTY.rate/100/12;
  const start = new Date(PROPERTY.updated+'T00:00:00');
  const now = new Date();
  let months = (now.getFullYear()-start.getFullYear())*12 + (now.getMonth()-start.getMonth());
  months = Math.max(0, months);
  let bal = PROPERTY.loan;
  for(let m=0;m<months;m++){
    const interest = bal*monthlyRate;
    let principal = (PROPERTY.payment - interest) + PROPERTY.extra;
    if(principal>bal) principal=bal;
    bal -= principal;
    if(bal<=0){ bal=0; break; }
  }
  return Math.round(bal);
}
// 预估：从当前余额起，按当前月供+额外，还需多少个月还清 & 总利息
function payoffEstimate(){
  const monthlyRate = PROPERTY.rate/100/12;
  let bal = amortizeNow();
  let months=0, totalInterest=0;
  const pay = PROPERTY.payment + PROPERTY.extra;
  while(bal>0 && months<600){
    const interest = bal*monthlyRate;
    let principal = pay - interest;
    if(principal<=0){ months=-1; break; } // 月供不够付利息
    if(principal>bal) principal=bal;
    totalInterest += interest;
    bal -= principal;
    months++;
  }
  return {months, totalInterest:Math.round(totalInterest)};
}
const ORDER = ['stock','cd','bond','hsa','cash'];
const ORDER_TAX = ['retire'];
const ALL = ORDER.concat(ORDER_TAX);


// ---- 本地存储：CD 列表统一管理（首次用 DATA 里的初始值播种） ----

function deductExpenseFromCash(expenseMap){
  const d=new Date();
  const ym=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  const newTotal=Object.values(expenseMap||{}).reduce(function(s,v){ return s+(parseFloat(v)||0); },0);
  let st=loadExpenseDeductState();
  if(st.ym!==ym){ st={ym:ym, total:0}; }   // 新的一个月，已扣记录清零重新累计
  const delta=newTotal-st.total;
  if(delta>0.001){
    const c=DATA.cash.groups[0].holdings.find(function(x){return x.sym==='Chase';});
    if(c){ c.mv=Math.round((c.mv||0)-delta); persistSimple('cash','cashList_v1'); }
  }
  st.total=newTotal;
  saveExpenseDeductState(st);
}

function syncStockFromSheet(){
  fetch(SHEET_API)
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(!data || data.status!=='success' || !data.stock) return;
      if(data.expense){ monthExpense = data.expense; deductExpenseFromCash(monthExpense); }
      rebuildStockGroups(data.stock);
      persistStock();
      // 重新计算并刷新界面
      recomputeAll();
      if(typeof renderCashTabBody==='function' && document.getElementById('cashTabBody')){
        renderCashTabBody();
      }
    })
    .catch(function(e){ console.log('sheet sync failed', e); });
}

function rebuildStockGroups(rows){
  // 按 GROUP_META 顺序建空组
  const groups = GROUP_META.map(function(m){
    return {cat:m.cat, sub:m.sub, semi:m.semi||false, holdings:[]};
  });
  const groupByCat = {};
  groups.forEach(function(g){ groupByCat[g.cat]=g; });

  rows.forEach(function(row){
    const sym = (row.symbol||'').toString().trim();
    if(!sym) return;
    // 现金：作为 noprice 放进"黄金·加密·现金"组
    if(sym.toLowerCase()==='cash' || sym==='\u73b0\u91d1'){
      const g = groupByCat['\u9ec4\u91d1 \u00b7 \u52a0\u5bc6 \u00b7 \u73b0\u91d1'];
      // 方案A：以 Sheet 的 E 列(price)为准；Sheet 为空时用本地值
      const sheetCash = parseFloat(row.price);
      const cashVal = isFinite(sheetCash) ? sheetCash : loadBrokerCash();
      saveBrokerCash(cashVal);   // 同步到本地
      g.holdings.push({sym:'\u73b0\u91d1', noprice:true, mv:Math.round(cashVal), desc:'\u5238\u5546\u53ef\u7528\u00b7\u53ef\u70b9\u51fb\u7f16\u8f91'});
      return;
    }
    const rawCat = (row.category||'').toString().trim();
    const appCat = CAT_MAP[rawCat] || '\u4e3b\u9898 ETF'; // 未知归入主题
    const g = groupByCat[appCat] || groupByCat['\u4e3b\u9898 ETF'];
    const shares = parseFloat(row.shares)||0;
    const cost = parseFloat(row.cost)||0;
    const price = parseFloat(row.price)||0;
    g.holdings.push({
      sym: sym,
      shares: shares,
      cost: cost||price,   // 成本为空时暂用现价（利润0）
      price: price,
      desc: SYM_DESC[sym] || ''
    });
  });
  // 去掉没有持仓的空组
  DATA.stock.groups = groups.filter(function(g){ return g.holdings.length>0; });
}

// 打开时结算 payroll：按设定频率（weekly/biweekly/monthly）从 lastPayDate 起补发
function nextPayDate(d, freq){
  const n=new Date(d);
  if(freq==='weekly'){ n.setDate(n.getDate()+7); }
  else if(freq==='monthly'){ n.setMonth(n.getMonth()+1); }
  else{ n.setDate(n.getDate()+14); }   // biweekly（默认）
  return n;
}
function runPayroll(){
  const cfg=loadIncome();
  if(!cfg.payroll || !cfg.payroll.amount || !cfg.payroll.start) return;
  const amt=cfg.payroll.amount;
  const freq=cfg.payroll.freq||'biweekly';
  let last=cfg.lastPayDate? new Date(cfg.lastPayDate+'T00:00:00') : new Date(cfg.payroll.start+'T00:00:00');
  const today=new Date(); today.setHours(0,0,0,0);
  let paid=false;
  if(!cfg.lastPayDate){
    // 发放起始日当天先发一次
    if(new Date(cfg.payroll.start+'T00:00:00')<=today){ addToChase(amt); last=new Date(cfg.payroll.start+'T00:00:00'); paid=true; }
  }
  // 之后按频率补发
  while(true){
    const next=nextPayDate(last, freq);
    if(next<=today){ addToChase(amt); last=next; paid=true; } else break;
  }
  if(paid){ cfg.lastPayDate=last.toISOString().slice(0,10); saveIncome(cfg); }
}

function daysBetween(d1,d2){ return Math.max(0, Math.round((d2 - d1)/86400000)); }
function rollCd(item){
  if(item.baseMv==null){ item.baseMv=item.mv||0; item.updated=item.updated||'2026-07-31'; item.rate=item.rate||0; }
  const start=new Date(item.updated+'T00:00:00');
  const today=new Date(); today.setHours(0,0,0,0);
  const days=daysBetween(start,today);
  const interest=item.baseMv*(item.rate/100)/365*days;
  item.mv=Math.round(item.baseMv+interest);

  item.desc=(item.mat?('\u5230\u671f '+item.mat.replace(/-/g,'/')):'')+(days>0?('  \u00b7  \u4f30\u606f +$'+interest.toFixed(0)):'');
  return item;
}

// 根据起始日+期限算到期日
function calcMaturity(startStr, termYears){
  if(!startStr||!termYears) return '';
  const d=new Date(startStr+'T00:00:00');
  d.setFullYear(d.getFullYear()+parseInt(termYears));
  return d.toISOString().slice(0,10);
}
// 待处理的国债利息弹窗队列
let bondInterestQueue = [];
function rollBond(item){
  // 兼容旧数据
  if(item.baseMv==null){ item.baseMv=item.mv||0; }
  if(!item.start){ item.start=item.updated||'2026-07-31'; }
  if(!item.term){ item.term=1; }
  if(!item.btype){ item.btype='T-Note'; }
  item.mat = calcMaturity(item.start, item.term);
  const today=new Date(); today.setHours(0,0,0,0);
  const start=new Date(item.start+'T00:00:00');

  if(item.btype==='I-Bond'){
    // I-Bond：每半年复利一次，利息累加进余额（不转现金）
    if(item.lastCompound==null) item.lastCompound=item.start;
    let last=new Date(item.lastCompound+'T00:00:00');
    let bal=item.mv!=null?item.mv:item.baseMv;
    let compounded=false;
    while(true){
      const next=new Date(last); next.setMonth(next.getMonth()+6);
      if(next<=today){
        bal = bal * (1 + (item.rate/100)/2);   // 半年复利
        last = next; compounded=true;
      } else break;
    }
    if(compounded){ item.mv=Math.round(bal); item.lastCompound=last.toISOString().slice(0,10); }
    else if(item.mv==null){ item.mv=item.baseMv; }
    item.qty=(item.rate?item.rate+'%':'');
    item.desc='I-Bond \u00b7 '+(item.mat?('\u5230\u671f '+item.mat.replace(/-/g,'/')):'');
  } else if(item.btype==='T-Bill'){
    // T-Bill：到期一次性兑付，期间余额不变（折价收益略过）
    item.mv=item.baseMv;
    item.qty=(item.rate?item.rate+'%':'');
    item.desc='T-Bill \u00b7 '+(item.mat?('\u5230\u671f '+item.mat.replace(/-/g,'/')):'');
  } else {
    // T-Note：每半年生成利息（本金×利率÷2），排队弹窗转现金
    item.mv=item.baseMv;  // 本金不变，利息是打出去的
    if(item.lastCoupon==null) item.lastCoupon=item.start;
    let last=new Date(item.lastCoupon+'T00:00:00');
    while(true){
      const next=new Date(last); next.setMonth(next.getMonth()+6);
      if(next<=today){
        const amt=Math.round(item.baseMv*(item.rate/100)/2);
        if(amt>0){
          bondInterestQueue.push({
            label:'T-Note '+item.term+'Y',
            amount:amt,
            date:next.toISOString().slice(0,10)
          });
        }
        last=next;
      } else break;
    }
    item.lastCoupon=last.toISOString().slice(0,10);
    item.qty=(item.rate?item.rate+'%':'');
    item.desc='T-Note \u00b7 '+(item.mat?('\u5230\u671f '+item.mat.replace(/-/g,'/')):'');
  }
  return item;
}
function rollAllBond(){
  bondInterestQueue=[];
  DATA.bond.groups[0].holdings.forEach(rollBond);
  persistBond();
}
loadBond(); rollAllBond();

function roll401k(){
  const it=DATA.retire.groups[0].holdings.find(x=>x.growth);
  if(!it) return;
  const start=new Date(it.updated+'T00:00:00');
  const now=new Date();
  let months=(now.getFullYear()-start.getFullYear())*12+(now.getMonth()-start.getMonth());
  months=Math.max(0,months);
  const mRet=it.rate/100/12;               // 月回报率
  const monthlyCon=(it.empCon||0)+(it.erCon||0);
  let bal=it.baseMv;
  for(let m=0;m<months;m++){ bal=bal*(1+mRet)+monthlyCon; }
  it.mv=Math.round(bal);
  // 本月预估涨幅（供显示）
  it._monthGain=Math.round(it.baseMv*mRet+monthlyCon);
  it.qty=(it.rate?it.rate+'% \u5e74\u56de\u62a5':'');
}

function openDetail(k){
  if(k==='cd') rollAllCd();
  if(k==='bond') rollAllBond();
  if(k==='retire') roll401k();
  const c=DATA[k], t=classTotal[k];
  document.getElementById('d-title').textContent=c.name;
  document.getElementById('d-back').style.color=c.color;
  const body=document.getElementById('d-body');
  let html='<div class="dhero" style="background:var(--'+k+'-bg)">'+
    '<div class="l" style="color:'+c.color+'">'+c.meta+'</div>'+
    '<div class="v num"><span class="cur">$</span>'+fmt(t)+'</div>'+
    '<div class="s">'+(ORDER.includes(k)?('\u5360\u6295\u8d44\u603b\u989d '+(t/grand*100).toFixed(1)+'%'):'\u7a0e\u4f18\u8d26\u6237 \u00b7 \u4e0d\u8ba1\u5165\u6295\u8d44\u603b\u989d')+'</div></div>';
  c.groups.forEach(function(g,gi){
    if(k==='cash') return;  // 现金页用收入/支出tab
    if(!g.holdings || g.holdings.length===0) return;  // 跳过空组（不渲染空壳）
    var gt=sumH(g);
    var accent = g.semi?'var(--neg)':c.color;

    // 组内所有行的 HTML
    var rowsHtml = g.holdings.map(function(hh,hi){
      // 股票行：股数 | 成本/利润% | 市值/占比
      if(k==='stock' && !hh.noprice && hh.shares!=null){
        var mv=hmv(hh);
        var prof=(hh.price-hh.cost)/hh.cost*100;
        var profCol=isFinite(prof)?((prof>=0?'+':'')+prof.toFixed(1)+'%'):'';
        var profColor=prof>=0?'var(--pos)':'var(--neg)';
        var sInner='<div class="tk"><div class="sym">'+hh.sym+'</div>'+
            '<div class="qty">'+(hh.shares%1?hh.shares.toFixed(3):hh.shares)+'\u80a1</div></div>'+
          '<div class="scost"><div class="ac">$'+hh.cost.toFixed(2)+'</div>'+
            '<div class="pr" style="color:'+profColor+'">'+profCol+'</div></div>'+
          '<div class="val"><div class="mv">$'+fmt(mv)+'</div>'+
            '<div class="pc">'+(mv/t*100).toFixed(1)+'%</div></div>';
        return '<div class="row" style="cursor:pointer" onclick="showStockPanel('+gi+','+hi+')">'+sInner+'</div>'+
          '<div class="stock-slot" id="slot-'+gi+'-'+hi+'"></div>';
      }
      // 无价条目（券商现金 / CD / 国债 / HSA / 退休）
      var inner='<div class="tk"><div class="sym">'+hh.sym+'</div><div class="qty">'+(hh.qty||'')+'</div></div>'+
        '<div class="desc">'+hh.desc+'</div>'+
        '<div class="val"><div class="mv">$'+fmt(hmv(hh))+'</div>'+
        '<div class="pc">'+(hmv(hh)/t*100).toFixed(1)+'%</div></div>';
      if(k==='cd' || k==='bond'){
        var editFn = k==='cd'?'editCd':'editBond';
        return '<div class="row" style="cursor:pointer" onclick="'+editFn+'('+hi+')">'+inner+'</div>';
      }
      if(k==='retire' && hh.growth){
        return '<div class="row" style="cursor:pointer" onclick="show401kForm()">'+inner+'</div>';
      }
      if(k==='hsa'){
        return '<div class="row" style="cursor:pointer" onclick="editSimple(\''+k+'\','+hi+')">'+inner+'</div>';
      }
      if(hh.noprice && hh.sym==='\u73b0\u91d1'){
        return '<div class="row" style="cursor:pointer" onclick="editBrokerCash()">'+inner+'</div>';
      }
      return '<div class="row">'+inner+'</div>';
    }).join('');

    // 一个大类 = 一张独立卡片（浅色标题 + 彩色左条 + 明细行）
    var headBg = (k==='stock') ? 'var(--stock-head)' : 'var(--'+k+'-bg)';
    html+='<div class="stkgroup" style="background:var(--'+k+'-bg);border-color:var(--'+k+'-ln)">'+
      '<div class="stkgroup-head" style="background:'+headBg+'">'+
        '<span class="stkbar" style="background:'+accent+'"></span>'+
        '<div class="stkcat">'+g.cat+(g.sub?'<span class="stksub">'+g.sub+'</span>':'')+'</div>'+
        '<span class="stkpc" style="color:'+accent+'">'+(gt/t*100).toFixed(1)+'%</span>'+
      '</div>'+
      '<div class="stkrows">'+rowsHtml+'</div>'+
    '</div>';
  });

  if(k==='cd'){
    html+='<div id="cdAddWrap"></div>';
  }
  if(k==='bond'){
    html+='<div id="bondAddWrap"></div>';
  }
  if(k==='hsa'){
    html+='<div id="simpleAddWrap"></div>';
  }
  if(k==='stock'){
    html+='<div id="stockAddWrap"></div>';
  }
  if(c.ledger){
    html+='<div id="incomeWrap"></div>';
  }

  body.innerHTML=html;
  if(k==='cd'){ renderCdAdd(); attachSwipe(); }
  if(k==='bond'){ renderBondAdd(); attachSwipe(); }
  if(k==='stock'){ attachSwipe(); renderStockAdd(); }
  if(k==='hsa'){ renderSimpleAdd('hsa'); attachSwipe(); }
  if(k==='cash'){ attachSwipe(); }
  if(k==='cash'){ renderIncome(); }
  go('detail');
}

function saveExtra(){
  const extra=parseFloat(document.getElementById('p-extra').value);
  const value=parseFloat(document.getElementById('p-value').value);
  let loan=parseFloat(document.getElementById('p-loan').value);
  const lump=parseFloat(document.getElementById('p-lump').value);
  if(extra>=0) PROPERTY.extra=Math.round(extra);
  if(value>0) PROPERTY.value=Math.round(value);
  if(loan>0){ PROPERTY.loan=Math.round(loan); PROPERTY.updated=new Date().toISOString().slice(0,10); }
  if(lump>0){
    // 一次性还贷：从当前余额直接扣除
    const cur = (loan>0?Math.round(loan):amortizeNow());
    PROPERTY.loan = Math.max(0, cur - Math.round(lump));
    PROPERTY.updated = new Date().toISOString().slice(0,10);
  }
  persistProp();
  renderPropPage();
  renderPropCard();
}
renderPropPage();

function saveCd(){
  const name=document.getElementById('f-name').value.trim();
  const mv=parseFloat(document.getElementById('f-mv').value);
  const rate=parseFloat(document.getElementById('f-rate').value)||0;
  const mat=document.getElementById('f-mat').value;
  if(!name || !(mv>0)){ alert('\u8bf7\u81f3\u5c11\u586b\u5199\u8d26\u6237\u540d\u548c\u91d1\u989d'); return; }
  const today=new Date().toISOString().slice(0,10);
  const item={sym:name, rate:rate, mat:mat, baseMv:Math.round(mv), updated:today};
  rollCd(item);
  if(editingCdIndex>=0){
    DATA.cd.groups[0].holdings[editingCdIndex]=item;  // 覆盖编辑
    editingCdIndex=-1;
  }else{
    DATA.cd.groups[0].holdings.push(item);            // 新增
    const srcEl=document.getElementById('f-src');
    if(srcEl && srcEl.value){ deductSource(srcEl.value, item.baseMv); }
  }
  persistCd();
  recompute();
  openDetail('cd');
}
// 重新计算所有总额与占比（新增后调用）
function recompute(){
  rollAllCd(); rollAllBond(); roll401k();
  grand=0;
  ALL.forEach(k=>{classTotal[k]=sumC(DATA[k]);});
  ORDER.forEach(k=>{grand+=classTotal[k];});
  document.getElementById('total').textContent=fmt(grand);
  const safeGrand = grand>0 ? grand : 1;  // 避免总额为0时除0出错
  const bar=document.getElementById('allocbar'); bar.innerHTML='';
  ORDER.forEach(k=>{const s=document.createElement('span');
    s.style.width=(classTotal[k]/safeGrand*100)+'%';s.style.background=DATA[k].color;bar.appendChild(s);});
  // 按每张卡的 data-key 找到自己对应的类别，避免按位置回填导致错位
  document.querySelectorAll('#classlist .ccard').forEach(function(card){
    const k=card.dataset.key;
    if(!k || !ALL.includes(k)) return;
    const t=classTotal[k];
    const mvEl=card.querySelector('.amt .mv');
    if(mvEl) mvEl.textContent='$'+fmt(t);
    const pcEl=card.querySelector('.amt .pc');
    if(pcEl && ORDER.includes(k)) pcEl.textContent=(t/safeGrand*100).toFixed(1)+'%';
  });
}

// swipe gesture: attach after CD detail render
function attachSwipe(){
  document.querySelectorAll('#scr-detail .swipe').forEach(function(sw){
    let startX=0, cur=0, dragging=false;
    const row=sw.querySelector('.swipe-row');
    sw.addEventListener('touchstart',function(e){startX=e.touches[0].clientX;dragging=true;row.style.transition='none';},{passive:true});
    sw.addEventListener('touchmove',function(e){
      if(!dragging)return;
      let dx=e.touches[0].clientX-startX;
      if(sw.classList.contains('open')) dx-=76;
      dx=Math.max(-76,Math.min(0,dx));
      cur=dx; row.style.transform='translateX('+dx+'px)';
    },{passive:true});
    sw.addEventListener('touchend',function(){
      dragging=false;row.style.transition='';
      if(cur<-38){ sw.classList.add('open'); } else { sw.classList.remove('open'); }
      cur=0;
    });
  });
}

// ==================== 写回 Google Sheet ====================
// 用 no-cors 发送：Apps Script 的 POST 会内部跳转，普通模式会被浏览器判为跨域失败。
// no-cors 下请求照常送达 Sheet，只是拿不到回执（属正常，不代表失败）。
function pushToSheet(payload){
  return fetch(SHEET_API, {
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  }).then(function(){
    console.log('sheet write sent:', payload.action, payload.symbol||'');
  }).catch(function(e){
    console.log('sheet write failed', e);
    alert('\u5df2\u5728\u672c\u5730\u66f4\u65b0\uff0c\u4f46\u540c\u6b65\u5230 Sheet \u5931\u8d25\uff08\u7f51\u7edc\u95ee\u9898\uff09');
  });
}
function syncStockToSheet(it){
  if(!it) return;
  pushToSheet({action:'updateStock', symbol:it.sym,
               shares:Number(it.shares.toFixed(4)), cost:Number(it.cost.toFixed(4))});
}
function syncCashToSheet(){
  pushToSheet({action:'updateCash', amount:loadBrokerCash()});
}

function stockAction(kind){
  const it=stockItem();
  const w=document.getElementById('stockActionWrap');
  if(kind==='price'){
    w.innerHTML='<div class="fld" style="margin-top:12px"><label>\u65b0\u6210\u672c\u4ef7 ($/\u80a1)</label>'+
      '<input id="s-price" type="number" inputmode="decimal" value="'+it.cost.toFixed(2)+'"></div>'+
      '<div style="font-size:11px;color:var(--ink-faint);margin-bottom:8px">\u73b0\u4ef7\u7531 Sheet \u81ea\u52a8\u62c9\u53d6\uff0c\u6b64\u5904\u4ec5\u4fee\u6b63\u6210\u672c</div>'+
      '<button class="save" style="background:var(--stock)" onclick="applyPrice()">\u786e\u8ba4</button>';
    document.getElementById('s-price').focus();
    return;
  }
  const isBuy=kind==='buy';
  w.innerHTML='<div class="fld" style="margin-top:12px"><label>'+(isBuy?'\u589e\u6301':'\u51cf\u6301')+'\u80a1\u6570</label>'+
    '<input id="s-sh" type="number" inputmode="decimal" placeholder="\u4f8b\uff1a10"></div>'+
    '<div class="fld"><label>'+(isBuy?'\u4e70\u5165':'\u5356\u51fa')+'\u4ef7 ($/\u80a1)</label>'+
    '<input id="s-px" type="number" inputmode="decimal" value="'+it.price+'"></div>'+
    '<button class="save" style="background:'+(isBuy?'var(--pos)':'var(--neg)')+'" onclick="'+(isBuy?'applyBuy':'applySell')+'()">\u786e\u8ba4'+(isBuy?'\u589e\u6301':'\u51cf\u6301')+'</button>';
  document.getElementById('s-sh').focus();
}
function applyBuy(){
  const it=stockItem();
  const sh=parseFloat(document.getElementById('s-sh').value);
  const px=parseFloat(document.getElementById('s-px').value);
  if(!(sh>0)||!(px>0)){ alert('\u8bf7\u8f93\u5165\u80a1\u6570\u548c\u4ef7\u683c'); return; }
  // 加权平均成本
  const newShares=it.shares+sh;
  it.cost=(it.shares*it.cost + sh*px)/newShares;
  it.shares=newShares;
  it.price=px;  // 用最新成交价更新现价
  // 从券商现金扣款
  const bc=brokerCashItem(); if(bc){ bc.mv=Math.max(0,Math.round((bc.mv||0)-sh*px)); saveBrokerCash(bc.mv); }
  afterStockChange();
  syncStockToSheet(it);
  syncCashToSheet();
}
function applySell(){
  const it=stockItem();
  const sh=parseFloat(document.getElementById('s-sh').value);
  const px=parseFloat(document.getElementById('s-px').value);
  if(!(sh>0)){ alert('\u8bf7\u8f93\u5165\u80a1\u6570'); return; }
  const sym=it.sym;
  const sellPx=(px>0?px:it.price);
  const soldOut = (sh>=it.shares-1e-9);   // 减持等于全部持仓
  // 卖出所得进券商现金
  const bc=brokerCashItem(); if(bc){ bc.mv=Math.round((bc.mv||0)+sh*sellPx); saveBrokerCash(bc.mv); }
  if(soldOut){
    // 清仓：本地删除整行 + Sheet 删除整行
    const g=DATA.stock.groups[curStock.gi];
    g.holdings.splice(curStock.hi,1);
    afterStockChange();
    pushToSheet({action:'deleteStock', symbol:sym});
  }else{
    it.shares=it.shares-sh;   // 成本不变
    if(px>0) it.price=px;
    afterStockChange();
    syncStockToSheet(it);
  }
  syncCashToSheet();
}
function applyPrice(){
  const it=stockItem();
  const c=parseFloat(document.getElementById('s-price').value);
  if(!(c>0)){ alert('\u8bf7\u8f93\u5165\u6709\u6548\u6210\u672c\u4ef7'); return; }
  it.cost=c;
  afterStockChange();
  syncStockToSheet(it);
}

// 券商现金：股票栏里 noprice 且 sym==='现金' 的条目
function brokerCashItem(){
  for(const g of DATA.stock.groups){
    for(const hh of g.holdings){ if(hh.noprice && hh.sym==='\u73b0\u91d1') return hh; }
  }

// Marcus OS-9250：储蓄栏
function marcusItem(){ return DATA.cd.groups[0].holdings.find(x=>x.sym==='OS-9250'); }

function getSource(key){ return key==='chase'?chaseItem():key==='marcus'?marcusItem():null; }
function sourceBalance(key){
  const it=getSource(key);
  if(!it) return 0;
  return it.baseMv!=null?it.baseMv:(it.mv||0);
}
function deductSource(key, amt){
  const it=getSource(key); if(!it) return;
  if(it.baseMv!=null){ it.baseMv=Math.max(0,Math.round(it.baseMv-amt)); it.updated=new Date().toISOString().slice(0,10); }
  else{ it.mv=Math.max(0,Math.round((it.mv||0)-amt)); }
  // persist对应类别
  if(key==='chase'){ persistSimple('cash','cashList_v1'); }
  if(key==='marcus'){ persistCd(); }
}
function addToTarget(key, amt){
  if(key==='broker'){
    const bc=brokerCashItem(); if(bc){ bc.mv=Math.round((bc.mv||0)+amt); saveBrokerCash(bc.mv); persistStock(); }
  }else if(key==='mortgage'){
    PROPERTY.loan=Math.max(0, Math.round((PROPERTY.loan!=null?PROPERTY.loan:amortizeNow())-amt));
    PROPERTY.updated=new Date().toISOString().slice(0,10);
    persistProp();
  }
}
// 执行一次转账
function doTransfer(srcKey, tgtKey, amt){
  if(!(amt>0)) return;
  deductSource(srcKey, amt);
  addToTarget(tgtKey, amt);
}

// ==================== 定期转账 ====================
function loadRecurring(){
  try{ return JSON.parse(localStorage.getItem('recurringTransfers_v1')||'[]'); }catch(e){ return []; }
}
function saveRecurring(list){ localStorage.setItem('recurringTransfers_v1', JSON.stringify(list)); }
// 打开时补执行：对每条定期转账，从 lastRun 到本月，缺几次补几次
function runRecurring(){
  const list=loadRecurring();
  const now=new Date(); const ym=now.getFullYear()*12+now.getMonth();
  let changed=false;
  list.forEach(r=>{
    let last=r.lastRun!=null?r.lastRun:(r.startYm-1);
    while(last<ym){
      last++;
      if(last>=r.startYm){ doTransfer(r.src, r.tgt, r.amt); }
    }
    if(r.lastRun!==last){ r.lastRun=last; changed=true; }
  });
  if(changed) saveRecurring(list);
}

  if(rec.length){
    html+='<div class="group"><div class="grp-head"><div class="cat">\u5df2\u8bbe\u7f6e\u7684\u5b9a\u671f\u8f6c\u8d26</div></div>'+

function submitOneTime(){
  const src=document.getElementById('o-src').value;
  const tgt=document.getElementById('o-tgt').value;
  const amt=parseFloat(document.getElementById('o-amt').value);
  if(!(amt>0)){ alert('\u8bf7\u8f93\u5165\u91d1\u989d'); return; }
  doTransfer(src,tgt,amt);
  recompute();
  renderTransfer();
  alert('\u5df2\u8f6c\u8d26 $'+fmt(amt)+'\uff1a'+optName(SRC_OPTS,src)+' \u2192 '+optName(TGT_OPTS,tgt));
}
function submitRecurring(){
  const src=document.getElementById('r-src').value;
  const tgt=document.getElementById('r-tgt').value;
  const amt=parseFloat(document.getElementById('r-amt').value);
  if(!(amt>0)){ alert('\u8bf7\u8f93\u5165\u91d1\u989d'); return; }
  const list=loadRecurring();
  const now=new Date();
  list.push({src,tgt,amt:Math.round(amt), startYm:now.getFullYear()*12+now.getMonth(), lastRun:now.getFullYear()*12+now.getMonth()});
  saveRecurring(list);
  renderTransfer();
  alert('\u5b9a\u671f\u8f6c\u8d26\u5df2\u8bbe\u7f6e\uff1a\u6bcf\u6708 $'+fmt(amt));
}
function delRecurring(i){
  const list=loadRecurring(); list.splice(i,1); saveRecurring(list); renderTransfer();
}

      '</div>'+
      '<div id="incomeFormWrap"></div>'+
      '<button style="width:100%;margin-top:12px;padding:13px;border:none;border-radius:14px;background:var(--card);color:var(--ink-2);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer" onclick="showChaseCashForm()">\u624b\u52a8\u4fee\u6539\u73b0\u91d1\u4f59\u989d</button>';
  }else{
    // 支出方块网格
    const expCats=['Bill & utilities','Shopping','Travel','Grocery','Dining','Auto & Gas','Entertainment','Health & Beauty','Home','Other'];
    const expColors={
      'Bill & utilities':'#e8f0fe','Shopping':'#f3e9fd','Travel':'#e3f6ea',
      'Grocery':'#fbf1d9','Dining':'#fce7f1','Auto & Gas':'#EFEDDA',
      'Entertainment':'#fdecec','Health & Beauty':'#FFF8F2','Home':'#E6DDF6','Other':'#DCDDE3'
    };
    // 从 Sheet 的 Ledger 读到的当月支出；类别匹配忽略大小写和空格
    const amounts={}; expCats.forEach(function(c){ amounts[c]=0; });
    Object.keys(monthExpense||{}).forEach(function(k){
      const key=k.trim().toLowerCase();
      const hit=expCats.find(function(c){ return c.toLowerCase()===key; });
      amounts[hit||'Other'] += (parseFloat(monthExpense[k])||0);

          '<div class="pc">'+expCats.length+' \u7c7b\u5408\u8ba1</div></div>'+
      '</div>';

function savePayroll(){
  const amt=parseFloat(document.getElementById('pay-amt').value);

  const cfg=loadIncome();
  cfg.payroll={amount:Math.round(amt), start:start, freq:freq};
  cfg.lastPayDate=null; // 重新从start结算
  saveIncome(cfg);
  runPayroll();
  recompute();
  openDetail('cash');
}

  const box=document.getElementById('buyStockForm');

      '<div class="fld"><label>\u80a1\u6570</label>'+

      '<div class="fld"><label>\u7c7b\u522b</label>'+
        '<select id="bs-cat" style="'+selStyle+'">'+
          STOCK_CATS.map(function(c){return '<option value="'+c+'">'+c+'</option>';}).join('')+
        '</select></div>'+
      '<div class="btns">'+
        '<button class="cancel" onclick="document.getElementById(\'buyStockForm\').innerHTML=\'\'">\u53d6\u6d88</button>'+
        '<button class="save" style="background:var(--stock)" onclick="submitBuyStock()">\u4e70\u5165</button>'+
      '</div></div>';
  document.getElementById('bs-sym').focus();
}
function submitBuyStock(){
  const sym=(document.getElementById('bs-sym').value||'').trim().toUpperCase();
  const cost=parseFloat(document.getElementById('bs-cost').value);
  const sh=parseFloat(document.getElementById('bs-sh').value);
  const cat=document.getElementById('bs-cat').value;
  if(!sym || !(cost>0) || !(sh>0)){ alert('\u8bf7\u586b\u5199\u4ee3\u7801\u3001\u6210\u672c\u4ef7\u3001\u80a1\u6570'); return; }
  // 找到对应分组（没有则用第一个）
  let g=DATA.stock.groups.find(function(x){return x.cat===cat;});
  if(!g){
    g={cat:cat, sub:'', semi:(cat===STOCK_CATS[0]), holdings:[]};
    DATA.stock.groups.push(g);
  }
  // 若该股已存在于组内 -> 加权平均
  let existing=g.holdings.find(function(x){return x.sym===sym;});
  if(existing){
    const totSh=existing.shares+sh;
    existing.cost=(existing.shares*existing.cost+sh*cost)/totSh;
    existing.shares=totSh;
  }else{
    g.holdings.push({sym:sym, shares:sh, cost:cost, price:cost, desc:''});
  }
  // 扣券商现金
  const bc=brokerCashItem(); if(bc){ bc.mv=Math.max(0,Math.round((bc.mv||0)-sh*cost)); saveBrokerCash(bc.mv); }
  persistStock();
  recompute();
  openDetail('stock');
  // 写回 Sheet：已存在则更新，否则新增
  const sheetCat=(STOCK_TAXONOMY.find(function(t){return t.cat===cat;})||{}).sheet||'Other ETF';
  if(existing){
    syncStockToSheet(existing);
  }else{
    pushToSheet({action:'addStock', symbol:sym, category:sheetCat,
                 shares:Number(sh.toFixed(4)), cost:Number(cost.toFixed(4))});
  }
  syncCashToSheet();
}

function saveChaseCash(){

function showBondInterestPopups(){
  if(!bondInterestQueue || bondInterestQueue.length===0) return;
  processNextBondInterest();
}
function processNextBondInterest(){
  if(bondInterestQueue.length===0){ 
    document.getElementById('bondModalMount').innerHTML=''; 
    recompute();
    return; 
  }
  const item=bondInterestQueue[0];
  const mount=document.getElementById('bondModalMount');
  mount.innerHTML=
    '<div class="imodal-bg"><div class="imodal">'+
      '<h3>\u56fd\u503a\u5229\u606f\u5230\u8d26</h3>'+
      '<p>\u56fd\u503a '+item.label+' \u751f\u6210\u5229\u606f\uff08'+item.date.replace(/-/g,'/')+'\uff09</p>'+
      '<div class="amt-big">$'+fmt(item.amount)+'</div>'+
      '<p>\u8bf7\u9009\u62e9\u5b58\u5165\u54ea\u4e2a\u73b0\u91d1\u8d26\u6237\uff1a</p>'+
      '<div class="choice">'+
        '<button style="background:#1a9d4a" onclick="acceptBondInterest(\'chase\')">Chase</button>'+
        '<button style="background:#7c3aed" onclick="acceptBondInterest(\'marcus\')">Marcus</button>'+
      '</div>'+
    '</div></div>';
}
function acceptBondInterest(dest){
  const item=bondInterestQueue.shift();
  if(item){
    if(dest==='chase'){ addToChase(item.amount); }
    else if(dest==='marcus'){
      const m=getSource('marcus');
      if(m){ if(m.baseMv!=null){ m.baseMv=Math.round(m.baseMv+item.amount);} else { m.mv=Math.round((m.mv||0)+item.amount);} persistCd(); }
    }
  }
  processNextBondInterest();
}
showBondInterestPopups();
