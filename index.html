<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="资产">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/apple-touch-icon.png">
<title>资产驾驶舱</title>
<style>
  :root{
    --bg:#f2f3f5; --card:#ffffff; --ink:#2e333d; --ink-2:#5d6675; --ink-faint:#9aa1b0;
    --line:#e2e5ea; --pos:#1a7f37; --neg:#c9314a; --radius:16px;

    --stock:#2f6fed;  --stock-bg:#e8f0fe;  --stock-ln:#c7dbfb;  --stock-head:#f0f5ff;
    --grphead-bg:#f0f1f3;
    --cd:#9333ea;     --cd-bg:#f3e9fd;     --cd-ln:#e3cdfa;
    --bond:#c2820a;   --bond-bg:#fbf1d9;   --bond-ln:#f2e0af;
    --cash:#7C9070;   --cash-bg:#D2E7D3;   --cash-ln:#c2ecd1;
    --retire:#4A90A4; --retire-bg:#D8E6EA; --retire-ln:#b6e9e3;
    --hsa:#e0692f; --hsa-bg:#fcece2; --hsa-ln:#f7d2bd;
    --prop:#db2777;   --prop-bg:#fce7f1;   --prop-ln:#f8cbdf;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
  .screen{position:absolute;inset:0;min-height:100%;
    padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 40px);
    max-width:520px;margin:0 auto;left:0;right:0;
    opacity:0;transform:translateX(24px);pointer-events:none;
    transition:opacity .22s ease,transform .22s ease;}
  .screen.active{opacity:1;transform:none;pointer-events:auto;position:relative;}
  .nav{display:flex;align-items:center;gap:10px;margin:6px 2px 18px;min-height:28px;}
  .nav .back{display:flex;align-items:center;gap:4px;font-size:15px;
    background:none;border:none;cursor:pointer;padding:4px 6px 4px 0;font-weight:500;}
  .nav .title{font-size:15px;font-weight:600;flex:1;}
  header{display:flex;justify-content:space-between;align-items:baseline;margin:8px 2px 20px;}
  header h1{font-size:15px;font-weight:600;letter-spacing:.01em;}
  header .date{font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums;
    background:none;border:none;font-family:inherit;cursor:pointer;padding:4px 0 4px 8px;}
  .hero{margin:0 2px 22px;}
  .hero .label{font-size:12px;color:var(--ink-2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;font-weight:500;}
  .hero .value{font-size:40px;font-weight:600;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink-2);}
  .hero .value .cur{font-size:20px;color:var(--ink-faint);font-weight:500;margin-right:4px;vertical-align:6px;}
  .hero .sub{margin-top:8px;font-size:13px;color:var(--ink-2);}
  .allocbar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:6px 2px 20px;gap:2px;}
  .allocbar span{display:block;height:100%;}
  .classlist{display:flex;flex-direction:column;gap:11px;margin-bottom:18px;}
  .ccard{display:flex;align-items:center;gap:12px;border-radius:var(--radius);
    padding:15px 16px;cursor:pointer;transition:filter .12s,transform .1s;}
  .ccard:active{filter:brightness(.97);transform:scale(.995);}
  .ccard .cbar{width:4px;align-self:stretch;border-radius:3px;flex:none;}
  .ccard .mid{flex:1;}
  .ccard .nm{font-size:15px;font-weight:600;color:var(--ink);}
  .ccard .meta{font-size:12px;color:var(--ink-2);margin-top:2px;}
  .ccard .amt{text-align:right;}
  .ccard .amt .mv{font-size:15px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;}
  .ccard .amt .pc{font-size:12px;color:var(--ink-2);margin-top:2px;font-variant-numeric:tabular-nums;font-weight:500;}
  .ccard .chev{font-size:16px;font-weight:500;margin-left:2px;}
  .gauge{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:22px;}
  .gauge .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
  .gauge .top .t{font-size:13px;color:var(--ink-2);font-weight:500;}
  .gauge .top .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;}
  .gauge .track{position:relative;height:8px;background:#eceef2;border-radius:4px;overflow:hidden;}
  .gauge .fill{position:absolute;left:0;top:0;height:100%;border-radius:4px;transition:width .4s;}
  .gauge .marks{position:relative;height:16px;margin-top:6px;}
  .gauge .mark{position:absolute;top:0;transform:translateX(-50%);font-size:10px;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
  .gauge .mark::before{content:"";position:absolute;top:-8px;left:50%;width:1px;height:5px;background:#c8cdd6;}
  .gauge .note{margin-top:12px;font-size:12px;color:var(--ink-2);line-height:1.5;}
  .dhero{border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  .dhero.dark{background:var(--card);border-width:1px 1px 1px 4px;border-style:solid;}
  .dhero.dark .v{color:var(--ink-2);}
  .dhero.dark .v .cur{color:var(--ink-faint);}
  .dhero.dark .s{color:var(--ink-2);}
  .dhero .l{font-size:12px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px;font-weight:600;}
  .dhero .v{font-size:32px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink-2);}
  .dhero .v .cur{font-size:16px;color:var(--ink-faint);margin-right:3px;vertical-align:4px;}
  .dhero .s{font-size:12px;color:var(--ink-2);margin-top:6px;font-weight:500;}
  .group{border:1px solid var(--stock-ln);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;}
  .grp-head{display:flex;align-items:center;gap:10px;padding:12px 15px;background:var(--grphead-bg);border-bottom:1px solid var(--stock-ln);}
  .grp-head .cat{flex:1;font-size:13px;font-weight:600;color:var(--ink);}
  .grp-head .cat .sub{display:block;font-size:11px;color:var(--ink-faint);font-weight:400;margin-top:2px;}
  .grp-head .gpc{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;}
  .row{display:flex;align-items:center;padding:12px 14px;border-top:1px solid var(--line);}
  .row:first-child{border-top:none;}
  .row .tk{flex:none;width:72px;}
  .row .tk .sym{font-size:14px;font-weight:600;color:var(--ink);}
  .row .tk .qty{font-size:11px;color:var(--ink-faint);margin-top:1px;font-variant-numeric:tabular-nums;font-weight:400;}
  .row .desc{flex:1;font-size:11px;color:var(--ink-2);padding:0 8px;line-height:1.3;}
  .row .val{text-align:right;flex:none;}
  .row .val .mv{font-size:14px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;}
  .row .val .pc{font-size:11px;color:var(--ink-faint);margin-top:1px;font-variant-numeric:tabular-nums;font-weight:400;}
  .placeholder{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
    padding:20px;text-align:center;color:var(--ink-2);font-size:13px;line-height:1.6;margin-top:8px;}

  .addbox{border:1px dashed var(--cd-ln);background:var(--cd-bg);border-radius:var(--radius);
    padding:16px;text-align:center;cursor:pointer;transition:filter .12s;margin-top:4px;}
  .addbox:active{filter:brightness(.97);}
  .addbox .plus{font-size:22px;font-weight:400;color:var(--cd);line-height:1;}
  .addbox .lbl{font-size:12px;color:var(--ink-2);margin-top:4px;}
  .editform{border:1px solid var(--cd-ln);background:var(--card);border-radius:var(--radius);
    padding:12px;margin-top:4px;}
  .editform .fld{margin-bottom:8px;}
  .editform label{display:block;font-size:11px;color:var(--ink-2);margin-bottom:3px;font-weight:500;}
  .editform input,.editform select{width:100%;border:1px solid var(--line);border-radius:10px;
    background:#fafbfc;padding:8px 10px;font-size:16px;color:var(--ink);font-family:inherit;
    font-variant-numeric:tabular-nums;-webkit-appearance:none;line-height:1.25;}
  .editform select{-webkit-appearance:menulist;padding:7px 8px;}
  .editform input:focus,.editform select:focus{outline:none;border-color:var(--cd);background:#fff;}
  .editform .btns{display:flex;gap:8px;margin-top:4px;}
  .editform button{flex:1;border:none;border-radius:10px;padding:10px;font-size:14px;
    font-weight:600;font-family:inherit;cursor:pointer;}
  .editform .save{background:var(--cd);color:#fff !important;border-radius:12px;}
  .editform .cancel{background:#eceef2;color:var(--ink-2);}
  .editform .danger{background:#fdecec;color:var(--neg);border:1px solid #f6c9d0;}
  .delrow{margin-top:10px;padding-top:12px;border-top:1px dashed var(--line);}

  .row .scost{flex:none;width:88px;text-align:right;padding-right:0;margin-left:auto;}
  .row .scost .ac{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:500;}
  .row .scost .pr{font-size:11px;margin-top:1px;font-variant-numeric:tabular-nums;font-weight:600;}
  .row .val{min-width:92px;margin-left:18px;}
  .stock-slot:empty{display:none;}
  .stock-slot .editform{margin:2px 0 10px;}

  .cashrow{display:flex;gap:10px;align-items:stretch;margin-bottom:18px;}
  .cashrow .ccard{flex:1;margin-bottom:0;}
  .xfer-btn{flex:none;width:66px;border-radius:var(--radius);border:none;cursor:pointer;
    background:#B6A9C8;color:var(--ink);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3px;font-weight:600;box-shadow:0 2px 8px rgba(182,169,200,.35);
    transition:transform .1s;}
  .xfer-btn:active{transform:scale(.96);}
  .xfer-btn .ic{font-size:15px;line-height:1;color:#EFE4D4;}
  .xfer-btn .tx{font-size:15px;color:#EFE4D4;}

  .cashtabs{display:flex;gap:8px;margin:16px 2px 12px;}
  .cashtab{flex:1;text-align:center;padding:11px;border-radius:12px;font-size:14px;font-weight:600;
    cursor:pointer;border:none;background:var(--card);color:var(--ink-2);transition:all .15s;}
  .cashtab.on-in{background:var(--cash-bg);border:none;color:var(--cash);}
  .cashtab.on-ex{background:#F8CCD8;border:none;color:#B86A78;}
  .expgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px;}
  .expcell{border:none;border-radius:14px;padding:11px 10px;}
  .expcell .nm{font-size:12px;font-weight:600;color:var(--ink);line-height:1.25;min-height:30px;}
  .expcell .amt{font-size:17px;font-weight:650;color:var(--ink);margin-top:4px;font-variant-numeric:tabular-nums;}
  .expcell .pc{font-size:10px;color:var(--ink-faint);margin-top:2px;font-variant-numeric:tabular-nums;}
  .expcell.exptotal{background:#F8CCD8;border:1.5px solid #B86A78;}

  .imodal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;}
  .imodal{background:var(--card);border-radius:20px;padding:22px 20px;max-width:340px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.2);}
  .imodal h3{margin:0 0 6px;font-size:17px;color:var(--ink);}
  .imodal p{margin:0 0 16px;font-size:14px;color:var(--ink-2);line-height:1.5;}
  .imodal .amt-big{font-size:24px;font-weight:700;color:var(--bond);margin:8px 0 14px;}
  .imodal .choice{display:flex;gap:10px;}
  .imodal .choice button{flex:1;padding:13px;border:none;border-radius:12px;font-size:15px;font-weight:600;
    font-family:inherit;cursor:pointer;color:#fff;}

  .stkgroup{border:1px solid var(--stock-ln);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;}
  .stkgroup-head{display:flex;align-items:center;gap:10px;padding:12px 14px;}
  .stkbar{width:4px;align-self:stretch;border-radius:3px;flex:none;min-height:20px;}
  .stkcat{flex:1;font-size:14px;font-weight:600;color:var(--ink);}
  .stkcat .stksub{display:block;font-size:11px;color:var(--ink-faint);font-weight:400;margin-top:2px;}
  .stkpc{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
  .stkrows .row{background:#F8FAFC;border-top:1px solid rgba(0,0,0,.05);padding:9px 14px;}
  .foot{text-align:center;font-size:11px;color:var(--ink-faint);margin-top:24px;line-height:1.6;}
  .foot .badge{display:inline-block;background:#e6e9ee;border:1px solid var(--line);border-radius:6px;
    padding:3px 8px;color:var(--ink-2);margin-bottom:8px;font-variant-numeric:tabular-nums;font-weight:400;}
  .foot .badge.err{background:#fdecec;border-color:#f6c9d0;color:#B86A78;}
</style>
</head>
<body>
<div id="bondModalMount"></div>

<div class="screen active" id="scr-overview">
  <header>
    <h1>资产驾驶舱</h1>
    <button class="date num" id="asof" onclick="syncStockFromSheet()">—</button>
  </header>
  <div id="noticeSlot"></div>
  <div class="hero">
    <div class="label">投资资产总额 · 不含房产、退休金</div>
    <div class="value num"><span class="cur">$</span><span id="total">—</span></div>
    <div class="sub"></div>
  </div>
  <div class="allocbar" id="allocbar"></div>
  <div class="classlist" id="classlist"></div>
  <div id="propslot"></div>
  <div class="foot">
    <div class="badge" id="syncBadge">同步中…</div><br>
    <div id="appVer" style="text-align:center;font-size:10px;color:var(--ink-faint);margin-top:6px"></div>
    点击任意大类查看明细 · 点右上角日期可手动重新同步
  </div>
</div>

<div class="screen" id="scr-detail">
  <div class="nav">
    <button class="back" id="d-back" onclick="go('overview')">&lsaquo; 总览</button>
    <span class="title" id="d-title">—</span>
  </div>
  <div id="d-body"></div>
</div>

<div class="screen" id="scr-property">
  <div class="nav">
    <button class="back" style="color:var(--prop)" onclick="go('overview')">&lsaquo; 总览</button>
    <span class="title">房产</span>
  </div>
  <div id="prop-body"></div>
</div>

<div class="screen" id="scr-transfer">
  <div class="nav">
    <button class="back" style="color:var(--cash)" onclick="go('overview')">&lsaquo; 总览</button>
    <span class="title">转账</span>
  </div>
  <div id="transfer-body"></div>
</div>

<script>
/* ============================================================
   资产驾驶舱  ·  v2 (2026-08-22)
   本轮修复：
   1. 转账到券商现金会写回 Sheet（原来会被下次同步覆盖 → 丢钱）
   2. 定期转账/工资结算改为「Sheet 同步成功后」才执行
   3. ASMI 全面统一为 ASMIY
   4. 同步完成后整页重绘（含卡片排序、集中度说明文字）
   5. CD / 国债 / HSA / 股票 全部可删除
   6. 券商现金编辑改内联表单（去掉 prompt）
   7. 写 Sheet 改串行队列，避免并发导致行号错乱
   8. 支出金额被改小时会把钱加回 Chase
   ============================================================ */

// 右上角日期。原来写的是 new Date().toISOString()，取的是 UTC 日期——
// 亚利桑那是 UTC-7，本地下午 5 点后就会显示成明天。改用本地当天；
// 同步成功后换成后端返回的 serverDate（按 America/Phoenix 生成，权威值）。
let ASOF = fmtD(todayD());

// ==================== 数据骨架 ====================
const DATA = {
  stock: {
    name:"股票", color:"var(--stock)", key:"stock", meta:"Webull · 含RSU",
    groups:[]   // 由 localStorage / Google Sheet 填充
  },
  cd: {
    name:"储蓄", color:"var(--cd)", key:"cd", meta:"Marcus · 定存+活期",
    // 数据全部来自 Sheet 的 Savings 表，本地不留种子：
    // 同步失败时宁可显示 $0 + 红色提示，也不要显示一份过期的假余额
    groups:[ { cat:"定期存单", sub:"", holdings:[] }]
  },
  bond: {
    name:"国债", color:"var(--bond)", key:"bond", meta:"TreasuryDirect",
    // 数据全部来自 Sheet 的 Bond 表，本地不留种子（同 cd）：
    // 首次安装宁可显示 $0，也不要闪一下写死的旧数字
    groups:[ { cat:"美国国债", sub:"", holdings:[] }]
  },
  cash: {
    name:"现金", color:"var(--cash)", key:"cash", meta:"Chase",
    groups:[ { cat:"操作账户", sub:"", holdings:[
      {sym:"Chase", qty:"~0%", desc:"日常操作账户", mv:0},   // 由 Sheet 的 cash.balance 覆盖
    ]}],
    ledger:true
  },
  retire: {
    name:"退休", color:"var(--retire)", key:"retire", meta:"税优·长期",
    groups:[ { cat:"税优账户", sub:"", holdings:[
      {sym:"401k", desc:"自动增长", baseMv:102000, updated:"2026-08-01",
        empCon:905, erCon:271, rate:15, growth:true},
      {sym:"Roth IRA", qty:"—", desc:"QQQM·SMH·SPAXX", mv:7515},
    ]}]
  },
  hsa: {
    name:"HSA", color:"var(--hsa)", key:"hsa", meta:"医疗储蓄",
    // 余额由 Sheet 的 HSA 表算（锚点 + HSA 流水 + 发薪日再分配），本地不留种子
    groups:[ { cat:"HSA 账户", sub:"", holdings:[] }]
  },
};

// 房产参数以 Sheet 的 Property 表为准，本地不留种子（同 cd / bond / cash）：
// 同步失败时宁可显示 $0，也不要拿一份写死的旧数字冒充真实余额 —— 那个数
// 看起来完全合理，反而最难发现是假的。
const PROPERTY = {
  value:0, loan:0, origLoan:0, rate:0,
  termYears:30, payment:0, extra:0, updated:""
};
try{ const sp=JSON.parse(localStorage.getItem('property_v1')||'null'); if(sp) Object.assign(PROPERTY,sp); }catch(e){}
function persistProp(){
  try{ localStorage.setItem('property_v1', JSON.stringify(PROPERTY)); }catch(e){}
  // Sheet 才是真相源；本地只是快取，换设备/清数据都不影响
  apiWrite(Object.assign({action:'saveProperty'}, PROPERTY));
}
// 服务器算好的房产参数覆盖本地。只覆盖真的有值的字段，
// Sheet 上某一格留空时不要把本地的数清掉。
function rebuildProperty(info){
  // Sheet 上还没填 → 把本地这份传上去，完成一次性迁移
  if(!info || !info.value){
    if(PROPERTY.value) apiWrite(Object.assign({action:'saveProperty'}, PROPERTY));
    return;
  }
  Object.keys(info).forEach(function(k){
    if(info[k]!=null && info[k]!=='') PROPERTY[k]=info[k];
  });
  try{ localStorage.setItem('property_v1', JSON.stringify(PROPERTY)); }catch(e){}
}

// ---- 方案 B：固定支出里的房贷金额跟随房产模块 ----
// 勾了 linkProp 的那条固定支出，金额取「标准月供 + 每月额外还本」，
// 不用存死数字。你在房产页调额外还本，下一期自动跟着变。
function fixedAmount(it){
  if(it && it.linkProp) return Math.round((PROPERTY.payment||0)+(PROPERTY.extra||0));
  return (it&&it.amount)||0;
}

const ORDER = ['stock','cd','bond','hsa','cash'];
const ORDER_TAX = ['retire'];
const ALL = ORDER.concat(ORDER_TAX);

// ==================== 股票分类（唯一数据源）====================
const STOCK_TAXONOMY = [
  {sheet:'Semiconductor',     cat:'半导体 / AI 硬件', sub:'最大集中风险', semi:true},
  {sheet:'IndexETF',          cat:'大盘指数 ETF',    sub:'标普500核心'},
  {sheet:'Tech/AI',           cat:'其他科技个股',    sub:''},
  {sheet:'Consumer',          cat:'消费',            sub:''},
  {sheet:'医疗',              cat:'医疗 ETF',        sub:'防御·低AI相关'},
  {sheet:'International ETF', cat:'国际股票 ETF',    sub:'非美分散'},
  {sheet:'Value ETF',         cat:'美股小盘 ETF',    sub:'小盘价值'},
  {sheet:'Other ETF',         cat:'其他主题 ETF',    sub:'国防/能源'},
  {sheet:'Gold.coin',         cat:'黄金 · 加密 · 现金', sub:'保险与待投资子弹'}
];
const CAT_MAP = {}; STOCK_TAXONOMY.forEach(function(t){ CAT_MAP[t.sheet]=t.cat; });
const GROUP_META = STOCK_TAXONOMY.map(function(t){ return {cat:t.cat, sub:t.sub, semi:t.semi||false}; });

// ==================== localStorage ====================
// 清掉历史遗留的键（储蓄已迁到 Sheet，不再本地存）
// 配置写入 localStorage。失败必须让人看见 —— 静默失败的表现就是
// 「点了保存像没保存上」，下次打开配置也不见了，很难查。
// 需要备份到 Sheet 的「设置类」数据。localStorage 只是本地快取，
// Sheet 才是真相源 —— iOS 重新 add to home screen 会开一个全新的存储容器，
// 清网站数据、换设备同理，只存本地等于没有备份。
// 房产走专用的 Property 表（可读键值表），不放这里，免得两个真相源
const CFG_KEYS=['fixedExpenses_v1','incomeConfig_v1','recurringTransfers_v1',
                'hsaConfig_v1','k401_v1'];
function persistCfg(key, val, label){
  const json=JSON.stringify(val);
  let localOk=true;
  try{ localStorage.setItem(key, json); }
  catch(e){ localOk=false; console.log('本地写入失败', key, e); }
  // 无论本地成没成，都要往 Sheet 备份一份
  if(CFG_KEYS.indexOf(key)>=0) apiWrite({action:'saveConfig', key:key, value:json});
  if(!localOk){
    alert('本地保存失败（可能是隐私模式或存储已满）。\n'+
          (label ? ('「'+label+'」') : '该设置')+'已备份到 Sheet，下次同步会自动取回。');
  }
  return true;   // 已经写进 Sheet，就算本地失败也不该中断后续流程
}
// 同步时：Sheet 上有的以 Sheet 为准写回本地；Sheet 上没有、本地却有的，
// 说明是这次改动之前留下的，顺手上传做一次迁移。
function syncConfigFromSheet(cfg){
  cfg=cfg||{};
  CFG_KEYS.forEach(function(k){
    if(Object.prototype.hasOwnProperty.call(cfg,k) && cfg[k]!=null){
      try{ localStorage.setItem(k, JSON.stringify(cfg[k])); }catch(e){}
    }else{
      let local=null;
      try{ local=localStorage.getItem(k); }catch(e){}
      if(local) apiWrite({action:'saveConfig', key:k, value:local});
    }
  });
}
// 固定支出 / 定期转账的 id 决定去重 key（fix:<id>:<日期>）。
// 原来用 Date.now()：配置一旦丢失（比如重新 add to home screen，
// localStorage 是全新的），重输就会换一个 id，于是 60 天补记窗口内
// 已经记过的账会被当成新账再记一遍 —— 直接多扣一笔。
// 改成由内容派生：重输同一笔，key 不变，服务器按 key 挡掉重复。
function stableId(prefix, parts){
  const raw=parts.join('|').toLowerCase().replace(/\s+/g,'');
  let h=0;
  for(let i=0;i<raw.length;i++){ h=(h*31+raw.charCodeAt(i))|0; }
  return prefix+(h>>>0).toString(36);
}

// 从流水明细重算当月各类别合计
function rebuildMonthExpense(){
  const ym=curYm(); const m={};
  ledgerRows.forEach(function(r){
    if((r.date||'').slice(0,7)!==ym) return;
    if(catKind(r.category)!=='expense') return;   // 收入、转账不算支出
    const cat=(r.category||'UNCATEGORIZED').trim();
    m[cat]=(m[cat]||0)+(parseFloat(r.amount)||0);
  });
  monthExpense=m;
  rebuildMonthTotals();
}
// 本地改过流水后，用明细重算「明细完整」那几个月的汇总，
// 否则刚补记的工资/支出要等下次同步才会反映到卡片上
function rebuildMonthTotals(){
  const months=(ledgerMonths&&ledgerMonths.length)?ledgerMonths:[curYm()];
  const acc={};
  months.forEach(function(ym){ acc[ym]={income:0,expense:0,transfer:0,redeem:0,hsaIn:0,hsaOut:0}; });
  ledgerRows.forEach(function(r){
    const ym=(r.date||'').slice(0,7);
    if(!acc[ym]) return;
    const amt=parseFloat(r.amount)||0;
    const k=catKind(r.category);
    if(k==='hsa'){ if(hsaKind(r.category)==='in') acc[ym].hsaIn+=amt; else acc[ym].hsaOut+=amt; }
    else if(k==='income') acc[ym].income+=amt;
    else if(k==='transfer') acc[ym].transfer+=amt;
    else if(k==='redeem') acc[ym].redeem+=amt;
    else acc[ym].expense+=amt;
  });
  Object.keys(acc).forEach(function(ym){
    const a=acc[ym];
    const prev=monthlyTotals[ym]||{};
    monthlyTotals[ym]=Object.assign({}, prev, a, {net:Math.round((a.income-a.expense)*100)/100});
  });
}

function setSyncBadge(state, extra){
  const el=document.getElementById('syncBadge');
  if(!el) return;
  el.classList.remove('err');
  if(state==='loading'){ el.textContent='同步中…'; }
  else if(state==='stale'){
    // 屏幕上是缓存数据：把数据时点写出来，当天只显示时分，隔天显示日期
    const t=new Date(extra||Date.now()), n=new Date();
    const sameDay = t.toDateString()===n.toDateString();
    el.textContent = (sameDay
        ? '上次同步 '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')
        : '数据为 '+(t.getMonth()+1)+'/'+t.getDate())+' · 更新中…';
  }
  else if(state==='ok'){
    const t=new Date();
    el.textContent='已同步 '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
  }else if(state==='writing'){
    el.textContent='写入中…';
  }else if(state==='writeerr'){
    el.classList.add('err');
    el.textContent='保存失败：'+(extra||'未知原因');
  }else{
    el.classList.add('err');
    el.textContent='同步失败，正在使用本地数据';
  }
}

// ---- 写 Sheet：串行队列 + GET（可拿到回执，写失败会明确报出来）----
let sheetQueue = Promise.resolve();
function apiWrite(payload){
  setSyncBadge('writing');
  sheetQueue = sheetQueue.then(function(){
    const qs = Object.keys(payload).map(function(k){
      const v = payload[k];
      return encodeURIComponent(k)+'='+encodeURIComponent(v==null?'':v);
    }).join('&');
    return fetch(SHEET_API+'?'+qs+'&_t='+Date.now())
      .then(function(r){ return r.json(); })
      .then(function(res){
        if(res && (res.status==='success' || res.status==='skipped')){
          setSyncBadge('ok');
          return res;
        }
        setSyncBadge('writeerr', (res&&res.message)||'写入被拒绝');
        return res||{status:'error'};
      });
  }).catch(function(e){
    console.log('sheet write failed', e);
    setSyncBadge('writeerr', '网络错误');
    return {status:'error', message:String(e)};
  });
  return sheetQueue;
}

      rebuildBonds(data.bond);
      rebuildHsa(data.hsa);
      notices = data.notices || [];
      syncOk = true;
      syncConfigFromSheet(data.config);   // 设置以 Sheet 为准，先落到本地再往下走
      rebuildProperty(data.property);
      cacheTs = 0;                // 拿到新数据，屏幕上不再是缓存
      if(data.serverDate) ASOF = data.serverDate;   // 服务器日期，不受本机时区影响
      saveSheetCache(data);       // 供下次打开垫底
      // 先把界面刷出来：渲染要用的数据这一个响应里已经全了，
      // 不该被下面那串串行的补记写操作挡住（每笔都是一次 Apps Script 往返）。
      rebuildMonthExpense();
      setSyncBadge('ok');

      renderNotices();
      refreshOpenDetail();   // 内部已整页重建，不必再单独刷一次明细列表

      // 固定支出 / 工资 / 定期转账：后台补记，写完再刷一次（Sheet 端按 key 去重）
      return runFixedExpenses()
        .then(function(){ return runPayroll(); })

        .then(function(){
          runRecurring();

          recompute();
          renderNotices();

        });
    })
    .catch(function(e){
      console.log('sheet sync failed', e);
      syncOk = false;
      runPayroll();
      setSyncBadge('err');
      recompute();
    });
}


function rebuildStockGroups(rows){
  const groups = emptyStockGroups();
  const groupByCat = {};
  groups.forEach(function(g){ groupByCat[g.cat]=g; });

  rows.forEach(function(row){
    const rawSym = (row.symbol||'').toString().trim();
    if(!rawSym) return;
    const sym = normSym(rawSym);

    // 券商现金行：金额存在 E 列（借用 Price 位置）
    if(sym==='CASH' || rawSym==='现金'){
      const g = groupByCat[GOLD_CAT];
      const sheetCash = parseFloat(row.price);
      const cashVal = isFinite(sheetCash) ? sheetCash : loadBrokerCash();
      saveBrokerCash(cashVal);
      g.holdings.push({sym:'现金', noprice:true, mv:Math.round(cashVal), desc:'券商账户现金 · 点击添加股票分红'});
      return;
    }

    const rawCat = (row.category||'').toString().trim();
    const appCat = CAT_MAP[rawCat] || THEME_CAT;
    const g = groupByCat[appCat] || groupByCat[THEME_CAT];
    const shares = parseFloat(row.shares)||0;
    const cost = parseFloat(row.cost)||0;
    const price = parseFloat(row.price)||0;
    g.holdings.push({
      sym: sym,
      shares: shares,
      cost: cost||price,
      price: price,
      desc: SYM_DESC[sym] || ''
    });
  });
  DATA.stock.groups = groups.filter(function(g){ return g.holdings.length>0; });
}

// ==================== 流动现金（Chase）====================
// 余额 = 锚点金额 + 锚点当天及之后的流水，由 Apps Script 算出权威值；
// 本地编辑时先按增量调整，等下次同步再对齐。不再有「已扣多少」这种状态。
let cashInfo = { balance:0, anchorDate:'', anchorAmount:0, hasAnchor:false };

// 规则必须与 AppsScript.gs 的 catKind 保持一致
function catKind(cat){
  const c=(cat||'').toString().trim();
  // HSA 必须最先判断：「HSA · Income · 供款」也要归到 hsa，不能被 Income 分支截走
  if(c.indexOf('HSA')===0) return 'hsa';          // HSA 账户内部流水：不碰流动现金
  if(c.indexOf('Income')===0) return 'income';    // 真收入：工资、利息、分红
  if(c.indexOf('Redeem')===0) return 'redeem';    // 本金回流：加现金但不算收入
  if(c.indexOf('Transfer')===0) return 'transfer';
  return 'expense';
}
// HSA 流水内部再分收支：带 Income 的是供款/雇主补助，其余是医疗开销
function hsaKind(cat){ return (cat||'').toString().indexOf('Income')>=0 ? 'in' : 'out'; }
// HSA 的钱走独立账户，不从 Chase 出，所以对流动现金的贡献是 0
function catSign(cat){ const k=catKind(cat); if(k==='hsa') return 0;
                       return (k==='income'||k==='redeem')?1:-1; }
function signedOf(r){ return catSign(r.category)*(parseFloat(r.amount)||0); }

// 记账起始日之前的账都已含在初始余额里，不补录
function bookFloor(){
  const d60=new Date(todayD()); d60.setDate(d60.getDate()-60);
  const bs=cashInfo && cashInfo.bookStart ? dateOf(cashInfo.bookStart) : null;
  return (bs && bs>d60) ? bs : d60;
}
function applyCashDelta(d){
  cashInfo.balance = Math.round((cashInfo.balance + d)*100)/100;
  const c=chaseItem();
  if(c) c.mv = Math.round(cashInfo.balance);
}

const FREQ_LABEL={monthly:'每月',quarterly:'每季度',semiannual:'每半年',annual:'每年'};
const FREQ_MONTHS={monthly:1,quarterly:3,semiannual:6,annual:12};

// 从起始日按频率推进，列出所有「已经到期且在最近 60 天内」的应记日期
function dueDates(item){
  const out=[];
  if(!item.start || !(item.amount>0)) return out;
  const today=new Date(); today.setHours(0,0,0,0);
  const floor=new Date(today); floor.setDate(floor.getDate()-60);   // 不倒补太久以前的
  const step=FREQ_MONTHS[item.freq]||1;
  let d=new Date(item.start+'T00:00:00');
  let guard=0;
  while(d<=today && guard++<400){
    if(d>=floor) out.push(d.toISOString().slice(0,10));
    d=new Date(d); d.setMonth(d.getMonth()+step);
  }
  return out;
}
// 已经在 Sheet 里存在的 key
function ledgerHasKey(k){
  return ledgerRows.some(function(r){ return (r.key||'')===k; });
}
let fixedRunning=null;   // 正在跑就复用同一个 Promise，避免两处同时算出同一笔任务
function runFixedExpenses(){
  if(fixedRunning) return fixedRunning;
  fixedRunning=runFixedExpensesInner().then(function(v){ fixedRunning=null; return v; },
                                           function(e){ fixedRunning=null; throw e; });
  return fixedRunning;
}
function runFixedExpensesInner(){
  const list=loadFixed().filter(function(x){ return x.enabled!==false; });
  const jobs=[];
  list.forEach(function(it){
    dueDates(it).forEach(function(ds){
      const key='fix:'+it.id+':'+ds;
      if(ledgerHasKey(key)) return;
      jobs.push({item:it, date:ds, key:key, amount:fixedAmount(it)});
    });
  });
  if(!jobs.length) return Promise.resolve();
  let chain=Promise.resolve();
  jobs.forEach(function(j){
    chain=chain.then(function(){

                       note:j.item.name+'（固定）'}).then(function(res){

                    amount:j.amount, note:j.item.name+'（固定）', key:j.key};

        }
      });
    });
  });
  return chain;

function nextPayDate(d, freq){
  const n=new Date(d);
  if(freq==='weekly'){ n.setDate(n.getDate()+7); }
  else if(freq==='monthly'){ n.setMonth(n.getMonth()+1); }
  else{ n.setDate(n.getDate()+14); }
  return n;
}
// 从起始日推进，列出「已到且在最近 60 天内」的发薪日
function payDatesDue(cfg){
  const out=[];
  const p=cfg&&cfg.payroll;
  if(!p||!p.amount||!p.start) return out;
  const today=todayD();
  const floor=bookFloor();
  let d=dateOf(p.start), guard=0;
  while(d<=today && guard++<400){
    if(d>=floor) out.push(fmtD(d));
    d=nextPayDate(d, p.freq||'biweekly');
  }
  return out;
}
function runPayroll(){
  const cfg=loadIncome();
  const p=cfg.payroll;
  if(!p||!p.amount) return Promise.resolve();
  const jobs=payDatesDue(cfg)
    .map(function(ds){ return {ds:ds, key:'pay:'+ds}; })
    .filter(function(j){ return !ledgerRows.some(function(r){ return (r.key||'')===j.key; }); });
  if(!jobs.length) return Promise.resolve();
  let chain=Promise.resolve();
  jobs.forEach(function(j){
    chain=chain.then(function(){
      return apiWrite({action:'autoLedger', key:j.key, date:j.ds,
                       category:'Income · Payroll', amount:p.amount, note:'工资'})
        .then(function(res){
          const nr={row:res&&res.row, date:j.ds, category:'Income · Payroll',
                    amount:p.amount, note:'工资', key:j.key};
          ledgerRows.push(nr);
          if(res && res.status==='success') applyCashDelta(signedOf(nr));
        });
    });
  });
  return chain.then(function(){ rebuildMonthExpense(); recompute(); });
}

// ==================== 房贷计算 ====================
function amortizeNow(){
  if(!PROPERTY.updated || !(PROPERTY.loan>0)) return Math.round(PROPERTY.loan||0);
  const monthlyRate = PROPERTY.rate/100/12;
  const start = new Date(PROPERTY.updated+'T00:00:00');
  const now = new Date();
  let months = (now.getFullYear()-start.getFullYear())*12 + (now.getMonth()-start.getMonth());
  months = Math.max(0, months);
  let bal = PROPERTY.loan;
  for(let m=0;m<months;m++){
    const interest = bal*monthlyRate;
    let principal = (PROPERTY.payment - interest) + PROPERTY.extra;
    if(principal>bal) principal=bal;
    bal -= principal;
    if(bal<=0){ bal=0; break; }
  }
  return Math.round(bal);
}
function payoffEstimate(){
  const monthlyRate = PROPERTY.rate/100/12;
  let bal = amortizeNow();
  let months=0, totalInterest=0;
  const pay = PROPERTY.payment + PROPERTY.extra;
  while(bal>0 && months<600){
    const interest = bal*monthlyRate;
    let principal = pay - interest;
    if(principal<=0){ months=-1; break; }
    if(principal>bal) principal=bal;
    totalInterest += interest;
    bal -= principal;
    months++;
  }
  return {months, totalInterest:Math.round(totalInterest)};
}

  if(h.shares!=null && h.price!=null){ h.mv=h.shares*h.price; return h.mv; }
  return h.mv||0;
}

// （股票是市值波动、现金无息、HSA 的 10% 是自设的预估，都不适合放这里）。
function classYield(k){
  if(k!=='cd' && k!=='bond') return null;
  const g=DATA[k].groups[0];
  const hs=(g&&g.holdings)||[];
  let weighted=0, total=0;
  hs.forEach(function(h){
    const mv=parseFloat(h.mv)||0, r=parseFloat(h.rate)||0;
    if(mv>0 && r>0){ weighted+=mv*r; total+=mv; }
  });
  return total>0 ? weighted/total : null;
}

// ==================== 详情页 ====================
function openDetail(k, keepScroll){
  if(k==='retire') roll401k();
  currentDetailKey=k;
  computeTotals();
  const c=DATA[k], t=classTotal[k];
  const safeT = t>0 ? t : 1;
  document.getElementById('d-title').textContent=c.name;
  document.getElementById('d-back').style.color=c.color;
  const body=document.getElementById('d-body');
  let html='<div class="dhero" style="background:var(--'+k+'-bg)">'+
    '<div class="l" style="color:'+c.color+'">'+c.meta+'</div>'+
    '<div class="v num"><span class="cur">$</span>'+fmt(t)+'</div>'+
    '<div class="s">'+(ORDER.includes(k)?('占投资总额 '+(grand>0?(t/grand*100).toFixed(1):'0.0')+'%'):'税优账户 · 不计入投资总额')+'</div></div>';

  c.groups.forEach(function(g,gi){
    if(k==='cash') return;
    if(!g.holdings || g.holdings.length===0) return;
    var gt=sumH(g);
    var accent = g.semi?'var(--neg)':c.color;

    var rowsHtml = g.holdings.map(function(hh,hi){
      // 股票行
      if(k==='stock' && !hh.noprice && hh.shares!=null){
        var mv=hmv(hh);
        var prof=(hh.cost>0)?((hh.price-hh.cost)/hh.cost*100):0;
        var profTxt=isFinite(prof)?((prof>=0?'+':'')+prof.toFixed(1)+'%'):'—';
        var profColor=prof>=0?'var(--pos)':'var(--neg)';
        var sInner='<div class="tk"><div class="sym">'+hh.sym+'</div>'+
            '<div class="qty">'+(hh.shares%1?hh.shares.toFixed(3):hh.shares)+'股</div></div>'+
          '<div class="scost"><div class="ac">$'+(hh.cost||0).toFixed(2)+'</div>'+
            '<div class="pr" style="color:'+profColor+'">'+profTxt+'</div></div>'+
          '<div class="val"><div class="mv">$'+fmt(mv)+'</div>'+
            '<div class="pc">'+(mv/safeT*100).toFixed(1)+'%</div></div>';
        return '<div class="row" style="cursor:pointer" onclick="showStockPanel('+gi+','+hi+')">'+sInner+'</div>'+
          '<div class="stock-slot" id="slot-'+gi+'-'+hi+'"></div>';
      }
      // 无价条目
      // 国债右下角显示到期日而不是占比（占比对单笔国债没意义）
      // 国债显示到期日；股票页（含券商现金）保留占比；其余板块单账户占比无意义，不显示
      var sub = (k==='bond' && hh.mat) ? hh.mat.replace(/-/g,'/')
              : (k==='stock' ? (hmv(hh)/safeT*100).toFixed(1)+'%' : '');
      var inner='<div class="tk" style="width:88px"><div class="sym">'+hh.sym+'</div><div class="qty">'+(hh.qty||'')+'</div></div>'+
        '<div class="desc">'+(hh.desc||'')+'</div>'+
        '<div class="val"><div class="mv">$'+fmt(hmv(hh))+'</div>'+
        (sub?('<div class="pc">'+sub+'</div>'):'')+'</div>';
      if(k==='cd' || k==='bond'){
        var editFn = k==='cd'?'editCd':'editBond';
        return '<div class="row" style="cursor:pointer" onclick="'+editFn+'('+hi+')">'+inner+'</div>';
      }
      if(k==='retire' && hh.growth){
        return '<div class="row" style="cursor:pointer" onclick="show401kForm()">'+inner+'</div>';
      }
      if(k==='hsa'){
        return '<div class="row" style="cursor:pointer" onclick="editHsaRow(\''+hh.sym+'\')">'+inner+'</div>';
      }
      if(hh.noprice && hh.sym==='现金'){
        return '<div class="row" style="cursor:pointer" onclick="showDividendForm()">'+inner+'</div>'+
               '<div class="stock-slot" id="cashslot"></div>';
      }
      return '<div class="row">'+inner+'</div>';
    }).join('');

    var headBg = (k==='stock') ? 'var(--stock-head)' : 'var(--'+k+'-bg)';
    html+='<div class="stkgroup" style="background:var(--'+k+'-bg);border-color:var(--'+k+'-ln)">'+
      '<div class="stkgroup-head" style="background:'+headBg+'">'+
        '<span class="stkbar" style="background:'+accent+'"></span>'+
        '<div class="stkcat">'+g.cat+(g.sub?'<span class="stksub">'+g.sub+'</span>':'')+'</div>'+
        '<span class="stkpc" style="color:'+accent+'">'+
          (k==='stock' ? (gt/safeT*100).toFixed(1)+'%'
                       : (grand>0?(t/grand*100).toFixed(1):'0.0')+'%')+'</span>'+
      '</div>'+
      '<div class="stkrows">'+rowsHtml+'</div>'+
    '</div>';
  });

  if(k==='cd')   html+='<div id="cdAddWrap"></div>';
  if(k==='bond') html+=renderNextPayments()+'<div id="bondAddWrap"></div>';
  if(k==='hsa')  html+='<div id="simpleAddWrap"></div><div id="hsaWrap"></div>';
  if(k==='stock')html+='<div id="stockAddWrap"></div>';
  if(c.ledger)   html+='<div id="incomeWrap"></div>';

  body.innerHTML=html;
  if(k==='cd')   renderCdAdd();
  if(k==='bond') renderBondAdd();
  if(k==='stock')renderStockAdd();
  if(k==='hsa'){ renderSimpleAdd('hsa'); renderHsa(); }
  if(k==='cash') renderIncome();
  if(!keepScroll) go('detail');
}

  const value=parseFloat(document.getElementById('p-value').value);
  let loan=parseFloat(document.getElementById('p-loan').value);
  const lump=parseFloat(document.getElementById('p-lump').value);
  if(extra>=0) PROPERTY.extra=Math.round(extra);
  if(value>0) PROPERTY.value=Math.round(value);
  if(loan>0){ PROPERTY.loan=Math.round(loan); PROPERTY.updated=fmtD(todayD()); }
  if(lump>0){
    const cur = (loan>0?Math.round(loan):amortizeNow());
    PROPERTY.loan = Math.max(0, cur - Math.round(lump));
    PROPERTY.updated = fmtD(todayD());
  }
  persistProp();
  renderPropPage();
  renderPropCard();
}

function editCd(i){
  editingCdIndex = i;
  const item = DATA.cd.groups[0].holdings[i];
  const wrap=document.getElementById('cdAddWrap');
  wrap.innerHTML=cdFormHtml({sym:item.sym, mv:item.mv, rate:item.rate, mat:item.mat, type:item.type}, true);
  wrap.scrollIntoView({behavior:'smooth',block:'center'});

let savingCd=false;
function saveCd(ev){
  if(savingCd) return;
  const btn=(ev&&ev.target)||document.querySelector('#cdAddWrap .save');
  const name=document.getElementById('f-name').value.trim();
  const mv=parseFloat(document.getElementById('f-mv').value);
  const rate=parseFloat(document.getElementById('f-rate').value)||0;
  const mat=document.getElementById('f-mat').value;
  if(!name || !(mv>0)){ alert('请至少填写账户名和金额'); return; }
  savingCd=true; setBusy(btn, true);
  const doneCd=function(){ savingCd=false; setBusy(btn, false); };

  if(editingCdIndex>=0){
    const it=DATA.cd.groups[0].holdings[editingCdIndex];
    const balChanged=(Math.round(mv)!==Math.round(it.mv));
    const payload={action:'updateSaving', id:it.id, name:name, rate:rate, maturity:mat};
    if(balChanged) payload.balance=mv;      // 手动改余额：以手动值为准，不结息
    // 本地先反映，界面立刻更新
    editingCdIndex=-1;
    it.sym=name; it.rate=rate; it.mat=mat; it.mv=Math.round(mv);
    recompute(); openDetail('cd', true);
    apiWrite(payload).then(function(res){
      doneCd();
      if(res && res.status==='success'){
        if(res.savings) rebuildSavings(res.savings);
        recompute(); openDetail('cd', true);
      }else alert('保存失败：'+((res&&res.message)||'未知原因'));
    });
  }else{
    const srcEl=document.getElementById('f-src');
    const srcKey=srcEl?srcEl.value:'';
    const type=(document.getElementById('f-type')||{}).value||'CD';
    const src=(srcKey==='marcus')?marcusItem():null;
    const tmpCd={id:'tmp'+Date.now(), sym:name, type:type, mv:Math.round(mv), rate:rate,
                 mat:mat, noprice:true, qty:rate?rate+'%':'', desc:'保存中…', pending:true};
    DATA.cd.groups[0].holdings.push(tmpCd);
    recompute(); openDetail('cd', true);
    apiWrite({action:'addSaving', name:name, type:type, balance:mv, rate:rate,
              maturity:mat, srcId:src?src.id:''}).then(function(res){
      doneCd();
      if(res && res.status==='success'){
        if(res.savings) rebuildSavings(res.savings);
        if(srcKey==='chase'){ deductSource('chase', Math.round(mv), 'marcus'); }
        recompute(); openDetail('cd', true);
      }else{
        DATA.cd.groups[0].holdings=DATA.cd.groups[0].holdings.filter(x=>x!==tmpCd);
        recompute(); openDetail('cd', true);
        alert('新增失败：'+((res&&res.message)||'未知原因'));
      }
    });
  }
}
function deleteCd(i){
  const item=DATA.cd.groups[0].holdings[i];
  if(!item) return;
  if(!confirm('删除 '+item.sym+' ？\n钱不会自动转到别处。')) return;
  editingCdIndex=-1;
  DATA.cd.groups[0].holdings.splice(i,1);
  recompute(); openDetail('cd', true);
  apiWrite({action:'deleteSaving', id:item.id}).then(function(res){
    if(res && res.status==='success'){ if(res.savings){ rebuildSavings(res.savings); recompute(); } }
    else{ alert('删除失败，正在恢复'); refreshFromSheet(); }
  });
}
// 重新拉一次 Savings（写操作之后用，拿 Apps Script 算好的权威值）
function refreshFromSheet(){
  return fetch(SHEET_API+'?_t='+Date.now())
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(data && data.status==='success'){
        rebuildSavings(data.savings);
        rebuildBonds(data.bond);
        rebuildHsa(data.hsa);
        setCashFromServer(data.cash);
        ledgerRows = Array.isArray(data.ledger) ? data.ledger : ledgerRows;
        monthlyTotals = data.monthly || monthlyTotals;
        notices = data.notices || [];
        cacheTs = 0;
        saveSheetCache(data);
        rebuildMonthExpense();
        recompute();
        renderNotices();
        if(currentDetailKey) openDetail(currentDetailKey, true);
      }
    }).catch(function(e){ console.log('refresh savings failed', e); });
}

let savingBond=false;
function setBusy(btn, on, label){
  if(!btn) return;
  btn.disabled=on;
  btn.style.opacity=on?'.55':'';
  if(on){ btn._t=btn.textContent; btn.textContent=label||'保存中…'; }
  else if(btn._t){ btn.textContent=btn._t; }
}
function saveBond(ev){
  if(savingBond) return;
  const btn=(ev&&ev.target)||document.querySelector('#bondAddWrap .save');
  const btype=document.getElementById('b-type').value;
  const start=document.getElementById('b-start').value;
  const term=document.getElementById('b-term').value;
  const mv=parseFloat(document.getElementById('b-mv').value);
  const rate=parseFloat(document.getElementById('b-rate').value)||0;
  const balEl=document.getElementById('b-bal');
  if(!start || !(mv>0)){ alert('请填写起始日和金额'); return; }
  const name=btype+' '+term+'Y';
  savingBond=true; setBusy(btn, true);
  const done=function(){ savingBond=false; setBusy(btn, false); };

  if(editingBondIndex>=0){
    const it=DATA.bond.groups[0].holdings[editingBondIndex];
    const payload={action:'updateBond', id:it.id, name:name, type:btype,
                   start:start, term:term, rate:rate, principal:mv};
    if(balEl && balEl.value!=='' && Math.round(parseFloat(balEl.value))!==Math.round(it.mv)){
      payload.balance=parseFloat(balEl.value);   // 手动校正余额时以填的为准
    }
    editingBondIndex=-1;
    it.sym=name; it.btype=btype; it.start=start; it.term=term; it.rate=rate; it.principal=mv;
    if(payload.balance!=null) it.mv=Math.round(payload.balance);
    recompute(); openDetail('bond', true);
    apiWrite(payload).then(function(res){
      done();
      if(res && res.status==='success'){
        if(res.bond) rebuildBonds(res.bond);
        recompute(); openDetail('bond', true);
      }else alert('保存失败：'+((res&&res.message)||'未知原因'));
    });
  }else{
    const srcEl=document.getElementById('b-src');
    const srcKey=srcEl?srcEl.value:'';
    const src=(srcKey==='marcus')?marcusItem():null;
    // 本地先插一条占位，界面立刻有反馈
    const tmp={id:'tmp'+Date.now(), sym:name, btype:btype, start:start, term:term,
               rate:rate, principal:mv, mv:Math.round(mv), noprice:true,
               mat:calcMaturity(start,term), qty:rate?rate+'%':'', desc:'保存中…', pending:true};
    DATA.bond.groups[0].holdings.push(tmp);
    recompute(); openDetail('bond', true);
    apiWrite({action:'addBond', name:name, type:btype, start:start, term:term,
              rate:rate, principal:mv, srcId:src?src.id:''}).then(function(res){
      done();
      if(res && res.status==='success'){
        if(res.bond) rebuildBonds(res.bond);       // 直接用返回值，省一次往返
        if(srcKey==='chase'){ deductSource('chase', Math.round(mv), 'bond'); }
        if(srcKey==='marcus') refreshFromSheet();  // 储蓄余额变了才需要重拉
        recompute(); openDetail('bond', true);
      }else{
        DATA.bond.groups[0].holdings=DATA.bond.groups[0].holdings.filter(x=>x!==tmp);
        recompute(); openDetail('bond', true);
        alert('新增失败：'+((res&&res.message)||'未知原因'));
      }
    });
  }
}
function deleteBond(i){
  const item=DATA.bond.groups[0].holdings[i];
  if(!item) return;
  if(!confirm('删除 '+item.sym+' ？\n钱不会自动转到别处。')) return;
  editingBondIndex=-1;
  DATA.bond.groups[0].holdings.splice(i,1);
  recompute(); openDetail('bond', true);
  apiWrite({action:'deleteBond', id:item.id}).then(function(res){
    if(res && res.status==='success'){ if(res.bond){ rebuildBonds(res.bond); recompute(); } }
    else{ alert('删除失败，正在恢复'); refreshFromSheet(); }
  });
}

function stockAction(kind){
  const it=stockItem();
  const w=document.getElementById('stockActionWrap');
  if(kind==='price'){
    w.innerHTML='<div class="fld" style="margin-top:12px"><label>新成本价 ($/股)</label>'+
      '<input id="s-price" type="number" inputmode="decimal" value="'+(it.cost||0).toFixed(2)+'"></div>'+
      '<div style="font-size:11px;color:var(--ink-faint);margin-bottom:8px">现价自动更新，此处仅修正成本</div>'+
      '<button class="save" style="background:var(--stock)" onclick="applyPrice()">确认</button>';
    document.getElementById('s-price').focus();
    return;
  }
  const isBuy=kind==='buy';
  w.innerHTML='<div class="fld" style="margin-top:12px"><label>'+(isBuy?'增持':'减持')+'股数</label>'+
    '<input id="s-sh" type="number" inputmode="decimal" placeholder="例：10"></div>'+
    '<div class="fld"><label>'+(isBuy?'买入':'卖出')+'价 ($/股)</label>'+
    '<input id="s-px" type="number" inputmode="decimal" value="'+it.price+'"></div>'+
    '<button class="save" style="background:'+(isBuy?'var(--pos)':'var(--neg)')+'" onclick="'+(isBuy?'applyBuy':'applySell')+'()">确认'+(isBuy?'增持':'减持')+'</button>';
  document.getElementById('s-sh').focus();
}
function applyBuy(){
  const it=stockItem();
  const sh=parseFloat(document.getElementById('s-sh').value);
  const px=parseFloat(document.getElementById('s-px').value);
  if(!(sh>0)||!(px>0)){ alert('请输入股数和价格'); return; }
  // 所有校验必须放在修改数据之前，否则用户点「取消」时持仓已经被改掉了
  const bc=brokerCashItem();
  if(!bc){ alert('Sheet 的 Stock 表里找不到 Cash 行，无法扣款。请先补一行 Cash。'); return; }
  const cost0=sh*px;
  if(cost0 > (bc.mv||0)+0.5){
    if(!confirm('券商现金只有 $'+fmt(bc.mv||0)+'，本次买入需要 $'+fmt(cost0)+
                '。\n继续的话现金会变成负数（说明有转入没记）。要继续吗？')) return;
  }
  const newShares=it.shares+sh;
  it.cost=(it.shares*it.cost + sh*px)/newShares;
  it.shares=newShares;
  it.price=px;
  afterStockChange();
  syncStockToSheet(it);
  adjustBrokerCash(-cost0);
}
function applySell(){
  const it=stockItem();
  const sh=parseFloat(document.getElementById('s-sh').value);
  const px=parseFloat(document.getElementById('s-px').value);
  if(!(sh>0)){ alert('请输入股数'); return; }
  const sym=normSym(it.sym);
  const sellPx=(px>0?px:it.price);
  const soldOut = (sh>=it.shares-1e-9);
  const proceeds=sh*sellPx;
  if(soldOut){
    DATA.stock.groups[curStock.gi].holdings.splice(curStock.hi,1);
    afterStockChange();
    apiWrite({action:'deleteStock', symbol:sym});   // 队列保证先删行、再写现金
  }else{
    it.shares=it.shares-sh;
    if(px>0) it.price=px;
    afterStockChange();
    syncStockToSheet(it);
  }
  adjustBrokerCash(proceeds);
}
function applyPrice(){
  const it=stockItem();
  const c=parseFloat(document.getElementById('s-price').value);
  if(!(c>0)){ alert('请输入有效成本价'); return; }
  it.cost=c;
  afterStockChange();
  syncStockToSheet(it);
}
function deleteStock(){
  const it=stockItem();
  if(!it) return;
  if(!confirm('删除 '+it.sym+' ？\n这不是卖出，券商现金不会增加。')) return;
  const sym=normSym(it.sym);
  DATA.stock.groups[curStock.gi].holdings.splice(curStock.hi,1);
  afterStockChange();
  apiWrite({action:'deleteStock', symbol:sym});
}
function afterStockChange(){
  DATA.stock.groups = DATA.stock.groups.filter(function(g){ return g.holdings.length>0; });
  persistStock();
  recompute();
  openDetail('stock', true);
}

function submitBuyStock(){
  const sym=normSym(document.getElementById('bs-sym').value);
  const cost=parseFloat(document.getElementById('bs-cost').value);
  const sh=parseFloat(document.getElementById('bs-sh').value);
  const cat=document.getElementById('bs-cat').value;
  if(!sym || !(cost>0) || !(sh>0)){ alert('请填写代码、成本价、股数'); return; }
  // 校验先做完，再动数据（避免点「取消」后持仓已被改）
  const bc=brokerCashItem();
  if(!bc){ alert('Sheet 的 Stock 表里找不到 Cash 行，无法扣款。请先补一行 Cash。'); return; }
  const need=sh*cost;
  if(need > (bc.mv||0)+0.5){
    if(!confirm('券商现金只有 $'+fmt(bc.mv||0)+'，本次买入需要 $'+fmt(need)+
                '。\n继续的话现金会变成负数（说明有转入没记）。要继续吗？')) return;
  }
  let g=DATA.stock.groups.find(function(x){return x.cat===cat;});
  if(!g){
    const meta=GROUP_META.find(function(m){return m.cat===cat;})||{cat:cat, sub:'', semi:false};
    g={cat:meta.cat, sub:meta.sub, semi:meta.semi, holdings:[]};
    DATA.stock.groups.push(g);
  }
  let existing=g.holdings.find(function(x){return normSym(x.sym)===sym;});
  if(existing){
    const totSh=existing.shares+sh;
    existing.cost=(existing.shares*existing.cost+sh*cost)/totSh;
    existing.shares=totSh;
  }else{
    g.holdings.push({sym:sym, shares:sh, cost:cost, price:cost, desc:SYM_DESC[sym]||''});
  }
  persistStock();
  recompute();
  openDetail('stock', true);
  const sheetCat=(STOCK_TAXONOMY.find(function(t){return t.cat===cat;})||{}).sheet||'Other ETF';
  if(existing){ syncStockToSheet(existing); }
  else{
    apiWrite({action:'addStock', symbol:sym, category:sheetCat,
                 shares:Number(sh.toFixed(4)), cost:Number(cost.toFixed(4))});
  }
  adjustBrokerCash(-need);
}

// 与 payDatesDue 同一套规则：从起始日按频率推进，只列最近 60 天内到期的
function hsaPayDatesDue(cfg){
  const out=[];
  if(!cfg||!cfg.start) return out;
  if(!((cfg.employee>0)||(cfg.employer>0))) return out;
  const today=todayD(), floor=bookFloor();
  let d=dateOf(cfg.start), guard=0;
  while(d<=today && guard++<400){
    if(d>=floor) out.push(fmtD(d));
    d=nextPayDate(d, cfg.freq||'biweekly');
  }
  return out;
}
// 每个发薪日给 HSA Cash 入两笔：本人供款、雇主补助。key 防重，与工资同构。
function runHsaContrib(){
  const cfg=loadHsaCfg();
  const jobs=[];
  hsaPayDatesDue(cfg).forEach(function(ds){
    if(cfg.employee>0) jobs.push({ds:ds, key:'hsaee:'+ds, cat:'HSA · Income · 供款',
                                  amt:Math.round(cfg.employee), note:'本人供款'});
    if(cfg.employer>0) jobs.push({ds:ds, key:'hsaer:'+ds, cat:'HSA · Income · 雇主补助',
                                  amt:Math.round(cfg.employer), note:'雇主补助'});
  });
  const todo=jobs.filter(function(j){ return !ledgerHasKey(j.key); });
  if(!todo.length) return Promise.resolve();
  let chain=Promise.resolve();
  todo.forEach(function(j){
    chain=chain.then(function(){
      return apiWrite({action:'autoLedger', key:j.key, date:j.ds,
                       category:j.cat, amount:j.amt, note:j.note})
        .then(function(res){
          ledgerRows.push({row:res&&res.row, date:j.ds, category:j.cat,
                           amount:j.amt, note:j.note, key:j.key});
        });
    });
  });
  return chain.then(function(){ rebuildMonthExpense(); recompute(); });
}

// 转账：从 Chase 出去的钱记进 Ledger（Transfer 前缀，不算支出），
// 从 Marcus 出去的由 Savings 引擎处理；到账端一律按增量写。
function transferLabel(key){
  return key==='broker'?'券商':key==='mortgage'?'房贷':key==='marcus'?'Marcus':key==='bond'?'国债':key;
}
function deductSource(key, amt, tgtKey, dateStr, dedupeKey){
  if(key==='chase'){
    const ds=dateStr||fmtD(todayD());
    const cat='Transfer · '+transferLabel(tgtKey);
    const tmp={row:-Date.now(), date:ds, category:cat, amount:Math.round(amt*100)/100,
               note:'', key:dedupeKey||''};
    ledgerRows.push(tmp);
    applyCashDelta(signedOf(tmp));
    apiWrite(dedupeKey
      ? {action:'autoLedger', key:dedupeKey, date:ds, category:cat, amount:tmp.amount, note:'定期转账'}
      : {action:'addLedger', date:ds, category:cat, amount:tmp.amount, note:''}
    ).then(function(res){ if(res&&res.status==='success') tmp.row=res.row; });
  }else if(key==='marcus'){
    const it=marcusItem(); if(!it) return;
    it.mv=Math.max(0,Math.round((it.mv||0)-amt));
    apiWrite({action:'adjustSaving', id:it.id, delta:-Math.round(amt)}).then(refreshFromSheet);
  }
}
function addToTarget(key, amt){
  if(key==='broker'){
    adjustBrokerCash(amt);
  }else if(key==='mortgage'){
    PROPERTY.loan=Math.max(0, Math.round((PROPERTY.loan!=null?PROPERTY.loan:amortizeNow())-amt));
    PROPERTY.updated=fmtD(todayD());
    persistProp();
  }else if(key==='marcus'){
    const it=marcusItem(); if(!it) return;
    it.mv=Math.round((it.mv||0)+amt);
    apiWrite({action:'adjustSaving', id:it.id, delta:Math.round(amt)}).then(refreshFromSheet);
  }
}
function doTransfer(srcKey, tgtKey, amt, dateStr, dedupeKey){
  if(!(amt>0)) return;
  if(srcKey===tgtKey) return;
  deductSource(srcKey, amt, tgtKey, dateStr, dedupeKey);
  addToTarget(tgtKey, amt);
}

// ==================== 定期转账 ====================
function loadRecurring(){
  try{ return JSON.parse(localStorage.getItem('recurringTransfers_v1')||'[]'); }catch(e){ return []; }
}
function saveRecurring(list){ return persistCfg('recurringTransfers_v1', list, '定期转账'); }
const XFER_FREQ={weekly:'每周',biweekly:'每两周',monthly:'每月'};
function nextByFreq(d, freq){
  const n=new Date(d);
  if(freq==='weekly') n.setDate(n.getDate()+7);
  else if(freq==='biweekly') n.setDate(n.getDate()+14);
  else n.setMonth(n.getMonth()+1);
  return n;
}
// 旧格式（按「年*12+月」计数）迁移成日期 + 频率
function migrateRecurring(r){
  if(r.start!=null) return false;
  const y=Math.floor((r.startYm||0)/12), m=(r.startYm||0)%12;
  r.start=fmtD(new Date(y, m, 1));
  r.freq=r.freq||'monthly';
  if(typeof r.lastRun==='number'){
    r.lastRun=fmtD(new Date(Math.floor(r.lastRun/12), r.lastRun%12, 1));
  }else{ r.lastRun=null; }
  delete r.startYm;
  return true;
}
// 每次自动转账带一个唯一 key，即使本地执行状态丢失也不会重复转
function xferKey(r, d){
  if(!r.id){ r.id=stableId('x',[r.src,r.tgt,r.amt,r.freq,r.start]); }
  return 'xfer:'+r.id+':'+fmtD(d);
}
function runRecurring(){
  const list=loadRecurring();
  const today=todayD();
  let changed=false;
  list.forEach(function(r){
    if(migrateRecurring(r)) changed=true;
    if(!r.start || !(r.amt>0)) return;
    const freq=r.freq||'monthly';
    let last=r.lastRun?dateOf(r.lastRun):null;
    if(!last){
      const st=dateOf(r.start);
      if(st<=today){ doTransfer(r.src, r.tgt, r.amt, fmtD(st), xferKey(r, st)); last=st; }
    }
    if(last){
      let guard=0;
      while(guard++<400){
        const nx=nextByFreq(last, freq);
        if(nx<=today){ doTransfer(r.src, r.tgt, r.amt, fmtD(nx), xferKey(r, nx)); last=nx; } else break;
      }
      const ds=fmtD(last);
      if(r.lastRun!==ds){ r.lastRun=ds; changed=true; }
    }
  });
  if(changed) saveRecurring(list);
}

// 下一次自动执行的日期
function nextXferDate(r){
  if(!r || !r.start) return '';
  const today=todayD();
  const freq=r.freq||'monthly';
  let d=r.lastRun?nextByFreq(dateOf(r.lastRun), freq):dateOf(r.start);
  let guard=0;
  while(d<=today && guard++<400){ d=nextByFreq(d, freq); }
  return fmtD(d).replace(/-/g,'/');
}

function submitTransfer(){ (xferMode==='recurring')?submitRecurring():submitOneTime(); }
function renderTransfer(){
  const body=document.getElementById('transfer-body');
  const chase=sourceBalance('chase'), marcus=sourceBalance('marcus');
  const rec=loadRecurring();
  const isRec=(xferMode==='recurring');
  let html=
    '<div style="display:flex;gap:8px;margin-bottom:10px">'+
      '<div style="flex:1;background:var(--cash-bg);border-radius:14px;padding:10px 12px">'+
        '<div style="font-size:11px;color:var(--ink-2)">Checking-Chase</div>'+
        '<div class="num" style="font-size:17px;font-weight:650">$'+fmt(chase)+'</div></div>'+
      '<div style="flex:1;background:var(--cd-bg);border-radius:14px;padding:10px 12px">'+
        '<div style="font-size:11px;color:var(--ink-2)">Marcus OS</div>'+
        '<div class="num" style="font-size:17px;font-weight:650">$'+fmt(marcus)+'</div></div>'+
    '</div>'+
    '<div class="editform" style="border-color:'+(isRec?'var(--retire-ln)':'var(--cash-ln)')+';margin-top:0">'+
      // 顶部两个切换按钮
      '<div style="display:flex;gap:8px;margin-bottom:10px">'+
        '<button onclick="setXferMode(\'once\')" style="flex:1;border:none;border-radius:10px;padding:9px;'+
          'font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;'+
          (isRec?'background:#eceef2;color:var(--ink-2)':'background:var(--cash-bg);color:var(--cash)')+'">一次性转账</button>'+
        '<button onclick="setXferMode(\'recurring\')" style="flex:1;border:none;border-radius:10px;padding:9px;'+
          'font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;'+
          (isRec?'background:var(--retire-bg);color:var(--retire)':'background:#eceef2;color:var(--ink-2)')+'">定期转账</button>'+
      '</div>'+
      transferFormFields('x', isRec)+
      '<div class="btns"><button class="save" style="background:'+(isRec?'var(--retire)':'var(--cash)')+'" '+
        'onclick="submitTransfer()">确认</button></div>'+
    '</div>';
  if(rec.length){
    html+='<div class="group"><div class="grp-head"><div class="cat">已设置的定期转账</div></div>'+
      rec.map(function(r,i){
        const nxt=nextXferDate(r);
        return '<div class="row" style="padding:10px 14px"><div class="tk" style="width:auto;flex:1">'+
          '<div class="sym" style="font-size:13px">'+optName(SRC_OPTS,r.src)+' → '+optName(TGT_OPTS,r.tgt)+'</div>'+
          '<div class="qty">'+(XFER_FREQ[r.freq||'monthly'])+' $'+fmt(r.amt)+'</div></div>'+
          '<div style="text-align:right;margin-right:12px">'+
            '<div style="font-size:11px;color:var(--ink-faint)">Next transfer</div>'+
            '<div class="num" style="font-size:12px;color:var(--ink-2);font-weight:600">'+(nxt||'—')+'</div></div>'+
          '<button class="cancel" style="padding:6px 12px;font-size:12px;border:none;border-radius:8px;background:#fdecec;color:var(--neg);font-family:inherit;font-weight:600;cursor:pointer" onclick="delRecurring('+i+')">删除</button></div>';
      }).join('')+'</div>';
  }
  body.innerHTML=html;
}
const XFER_SEL='';
function transferFormFields(p, withFreq){
  let h='<div class="fld" style="margin-bottom:8px"><label>From</label>'+
      '<select id="'+p+'-src" style="'+XFER_SEL+'">'+SRC_OPTS.map(o=>'<option value="'+o.k+'">'+o.n+'</option>').join('')+'</select></div>'+
    '<div class="fld" style="margin-bottom:8px"><label>To</label>'+
      '<select id="'+p+'-tgt" style="'+XFER_SEL+'">'+TGT_OPTS.map(o=>'<option value="'+o.k+'">'+o.n+'</option>').join('')+'</select></div>'+
    '<div class="fld" style="margin-bottom:8px"><label>金额 ($)</label>'+
      '<input id="'+p+'-amt" type="number" inputmode="decimal" placeholder="例：500"></div>';
  if(withFreq){
    h+='<div class="fld" style="margin-bottom:8px"><label>频率</label>'+
      '<select id="'+p+'-freq" style="'+XFER_SEL+'">'+
        Object.keys(XFER_FREQ).map(function(k){
          return '<option value="'+k+'"'+(k==='monthly'?' selected':'')+'>'+XFER_FREQ[k]+'</option>';
        }).join('')+'</select></div>'+
      '<div class="fld" style="margin-bottom:8px"><label>首次转账日</label>'+
        '<input id="'+p+'-start" type="date" value="'+fmtD(todayD())+'"></div>';
  }
  return h;
}
function submitOneTime(){
  const src=document.getElementById('x-src').value;
  const tgt=document.getElementById('x-tgt').value;
  const amt=parseFloat(document.getElementById('x-amt').value);
  if(!(amt>0)){ alert('请输入金额'); return; }
  if(tgt==='broker' && !syncOk){
    if(!confirm('当前与 Google Sheet 同步失败。\n此时转入券商现金可能在下次同步时被覆盖。\n仍要继续吗？')) return;
  }
  doTransfer(src,tgt,amt);
  recompute();
  renderTransfer();
  alert('已转账 $'+fmt(amt)+'：'+optName(SRC_OPTS,src)+' → '+optName(TGT_OPTS,tgt));
}
function submitRecurring(){
  const src=document.getElementById('x-src').value;
  const tgt=document.getElementById('x-tgt').value;
  const amt=parseFloat(document.getElementById('x-amt').value);
  const freq=document.getElementById('x-freq').value;
  const start=document.getElementById('x-start').value;
  if(!(amt>0)){ alert('请输入金额'); return; }
  if(!start){ alert('请选择首次转账日'); return; }
  const list=loadRecurring();
  // lastRun 留空：首次转账日到了就执行；设在未来则等到那天
  list.push({src:src, tgt:tgt, amt:Math.round(amt), freq:freq, start:start, lastRun:null});
  saveRecurring(list);
  runRecurring();
  recompute();
  renderTransfer();
  alert('已设置：'+XFER_FREQ[freq]+' $'+fmt(amt)+'，从 '+start.replace(/-/g,'/')+' 起');
}
function delRecurring(i){
  const list=loadRecurring(); list.splice(i,1); saveRecurring(list); renderTransfer();
}

// ==================== 现金页：收入 / 支出 ====================
function monthLabel(){
  const d=new Date();
  const mons=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return mons[d.getMonth()]+' '+d.getFullYear();
}
let cashTab='in';

  if(!wrap) return;
  wrap.innerHTML=

      '<div class="cashtab '+(cashTab==='in'?'on-in':'')+'" onclick="switchCashTab(\'in\')">收入</div>'+
      '<div class="cashtab '+(cashTab==='ex'?'on-ex':'')+'" onclick="switchCashTab(\'ex\')">支出</div>'+
    '</div>'+
    '<div style="margin:2px 2px 10px;font-size:12px;color:var(--ink-faint);font-weight:600">'+monthLabel()+'</div>'+

// ==================== 支出明细：改 / 删 / 补记 ====================
let expenseDrill=null;      // null=方块视图；分类名或 '__ALL__'=明细视图
let editingLedgerRow=null;
function openExpenseDrill(cat){ expenseDrill=cat; editingLedgerRow=null; renderCashTabBody(); }
function closeExpenseDrill(){ expenseDrill=null; editingLedgerRow=null; renderCashTabBody(); }

function drillRows(){
  const ym=curYm();
  return ledgerRows.filter(function(r){
    if((r.date||'').slice(0,7)!==ym) return false;
    if(expenseDrill==='__ALL__') return true;
    if(catKind(r.category)!=='expense') return false;
    return matchCat(r.category)===expenseDrill;
  }).sort(function(a,b){ return (a.date<b.date?1:a.date>b.date?-1:b.row-a.row); });
}

function renderExpenseDrill(body){
  const rows=drillRows();
  // 合计只算支出：全部明细里也会列出收入/转账行，但它们不计入这个数
  const sum=rows.reduce(function(s,r){
    return s + (catKind(r.category)==='expense' ? (parseFloat(r.amount)||0) : 0);
  },0);
  const title=(expenseDrill==='__ALL__')?'本月全部支出':expenseDrill;
  let html=
    '<div style="display:flex;align-items:center;gap:10px;margin:2px 2px 12px">'+
      '<button style="background:none;border:none;font-size:15px;font-weight:600;color:var(--cash);font-family:inherit;cursor:pointer;padding:4px 6px 4px 0" onclick="closeExpenseDrill()">&lsaquo; 支出</button>'+
      '<div style="flex:1;font-size:14px;font-weight:600">'+title+'</div>'+
      '<div class="num" style="font-size:15px;font-weight:600">$'+fmt(sum)+'</div>'+
    '</div>';
  if(!rows.length){
    html+='<div class="placeholder">本月这一类还没有记录</div>';
  }else{
    html+='<div class="group">'+rows.map(function(r){
      const isFix=!!(r.key||'');
      return '<div class="row" style="cursor:pointer" onclick="editLedger('+r.row+')">'+
        '<div class="tk" style="width:auto;flex:1">'+
          '<div class="sym" style="font-size:13px">'+(r.note||r.category)+(isFix?' · 固定':'')+'</div>'+
          '<div class="qty">'+(r.date||'').replace(/-/g,'/')+(expenseDrill==='__ALL__'?(' · '+r.category):'')+'</div>'+
        '</div>'+
        '<div class="val"><div class="mv" style="color:'+(catKind(r.category)==='income'?'var(--pos)':'var(--ink)')+'">'+
          (catKind(r.category)==='income'?'+':'−')+'$'+(parseFloat(r.amount)||0).toFixed(2)+'</div></div></div>'+
      '<div class="stock-slot" id="lg-'+r.row+'"></div>';
    }).join('')+'</div>';
  }
  html+='<button style="width:100%;margin-top:12px;padding:13px;border:none;border-radius:14px;background:var(--card);color:var(--ink-2);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer" onclick="showAddLedger()">+ 补记一笔</button><div id="addLedgerWrap"></div>';
  if(FIXED_CATS.indexOf(expenseDrill)>=0){ html+=renderFixedSection(expenseDrill); }
  body.innerHTML=html;
}

function ledgerFormHtml(v, isEdit){
  v=v||{};
  const st='';
  const cat=v.category||(expenseDrill&&expenseDrill!=='__ALL__'?expenseDrill:EXP_CATS[0]);
  const kind=catKind(cat);
  const INCOME_CATS=['Income · Payroll','Income · Bonus','Income · 国债利息','Income · 调整'];
  const HSA_CATS=['HSA · 医疗','HSA · Health & Beauty','HSA · 处方药','HSA · 其他'];
  const pool=(kind==='income')?INCOME_CATS:(kind==='hsa'?HSA_CATS:EXP_CATS);
  let opts=pool.map(function(c){ return '<option value="'+c+'"'+(cat===c?' selected':'')+'>'+c+'</option>'; }).join('');
  if(pool.indexOf(cat)<0){ opts='<option value="'+cat+'" selected>'+cat+(kind==='expense'&&!matchCat(cat)?'（不匹配，请改正）':'')+'</option>'+opts; }
  return '<div class="editform" style="border-color:var(--cash-ln)">'+
    '<div class="fld"><label>日期</label><input id="lg-date" type="date" value="'+(v.date||new Date().toISOString().slice(0,10))+'"></div>'+
    '<div class="fld"><label>分类</label><select id="lg-cat" style="'+st+'">'+opts+'</select></div>'+
    '<div class="fld"><label>金额 ($)</label><input id="lg-amt" type="number" inputmode="decimal" value="'+(v.amount!=null?v.amount:'')+'" placeholder="例：42.50"></div>'+
    '<div class="fld"><label>备注（选填）</label><input id="lg-note" value="'+(v.note||'').replace(/"/g,'&quot;')+'" placeholder="例：Costco 大采购" autocomplete="off"></div>'+
    '<div class="btns">'+
      '<button class="cancel" onclick="cancelLedgerForm()">取消</button>'+
      '<button class="save" style="background:var(--cash)" onclick="'+(isEdit?'saveLedgerEdit('+v.row+','+(v.amount||0)+')':'saveLedgerAdd()')+'">保存</button>'+
    '</div>'+
    (isEdit?'<div class="delrow"><button class="danger" style="width:100%;border-radius:10px;padding:12px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer" onclick="deleteLedgerRow('+v.row+','+(v.amount||0)+')">删除这笔</button></div>':'')+
  '</div>';
}
function cancelLedgerForm(){ editingLedgerRow=null; refreshLedgerViews(); }
function editLedger(row){
  const r=ledgerRows.find(function(x){ return x.row===row; });
  if(!r) return;
  if(editingLedgerRow===row){ editingLedgerRow=null; refreshLedgerViews(); return; }
  editingLedgerRow=row;
  refreshLedgerViews();
  const w=document.getElementById('lg-'+row);
  if(w){ w.innerHTML=ledgerFormHtml(r, true); w.scrollIntoView({behavior:'smooth',block:'center'}); }
}
function showAddLedger(){
  const w=document.getElementById('addLedgerWrap');
  if(!w) return;
  if(w.innerHTML){ w.innerHTML=''; return; }
  w.innerHTML=ledgerFormHtml({}, false);
  w.scrollIntoView({behavior:'smooth',block:'center'});
}
function readLedgerForm(){
  return {
    date:document.getElementById('lg-date').value,
    category:document.getElementById('lg-cat').value,
    amount:parseFloat(document.getElementById('lg-amt').value),
    note:document.getElementById('lg-note').value.trim()
  };
}
// 流水改动后刷新「当前打开的那个明细列表」。现金页和 HSA 页共用同一批
// ledgerRows，但各自只渲染属于自己的行，所以两边都要给机会重绘。
function refreshLedgerViews(){
  if(document.getElementById('cashTabBody')) renderCashTabBody();
  if(document.getElementById('hsaWrap'))     renderHsa();   // tab 上带着合计，要整块重绘
}
// 乐观更新：本地先改 → 立刻刷新界面 → 后台写 Sheet；失败自动撤回
function applyLocal(fn){
  fn();
  rebuildMonthExpense();
  recompute();
  refreshLedgerViews();
}
function writeFailed(res, what){
  alert(what+'失败，已撤回本地改动：\n'+((res&&res.message)||'网络或服务器问题'));
}

function saveLedgerAdd(){
  const v=readLedgerForm();
  if(!v.date || !(v.amount>0)){ alert('请填写日期和金额'); return; }
  const tmp={row:-Date.now(), date:v.date, category:v.category,
             amount:v.amount, note:v.note, key:'', pending:true};
  applyLocal(function(){ ledgerRows.push(tmp); applyCashDelta(signedOf(tmp)); });
  apiWrite({action:'addLedger', date:v.date, category:v.category, amount:v.amount, note:v.note})
    .then(function(res){
      if(res && res.status==='success'){ tmp.row=res.row; tmp.pending=false; refreshLedgerViews(); }
      else{ applyLocal(function(){ ledgerRows=ledgerRows.filter(function(x){ return x!==tmp; });
                                   applyCashDelta(-signedOf(tmp)); });
            writeFailed(res,'补记'); }
    });
}

function saveLedgerEdit(row, expectAmount){
  const v=readLedgerForm();
  if(!v.date || !(v.amount>0)){ alert('请填写日期和金额'); return; }
  const r=ledgerRows.find(function(x){ return x.row===row; });
  if(!r) return;
  const backup=Object.assign({}, r);
  editingLedgerRow=null;
  applyLocal(function(){
    const oldSigned=signedOf(r);
    r.date=v.date; r.category=v.category; r.amount=v.amount; r.note=v.note;
    applyCashDelta(signedOf(r)-oldSigned);
  });
  apiWrite({action:'updateLedger', row:row, expectAmount:expectAmount,
            date:v.date, category:v.category, amount:v.amount, note:v.note})
    .then(function(res){
      if(!(res && res.status==='success')){
        applyLocal(function(){
          const cur=signedOf(r); Object.assign(r, backup); applyCashDelta(signedOf(r)-cur);
        });
        writeFailed(res,'修改');
      }
    });
}

function deleteLedgerRow(row, expectAmount){
  if(!confirm('删除这笔支出？金额会自动加回 Chase。')) return;
  const idx=ledgerRows.findIndex(function(x){ return x.row===row; });
  if(idx<0) return;
  const backup=ledgerRows[idx];
  editingLedgerRow=null;
  applyLocal(function(){ ledgerRows.splice(idx,1); applyCashDelta(-signedOf(backup)); });
  apiWrite({action:'deleteLedger', row:row, expectAmount:expectAmount})
    .then(function(res){
      if(res && res.status==='success'){
        // Sheet 删行后，后面所有行号上移一位，本地跟着同步，避免下次改到错行
        ledgerRows.forEach(function(x){ if(x.row>row) x.row--; });
        refreshLedgerViews();
      }else{
        applyLocal(function(){ ledgerRows.splice(idx,0,backup); applyCashDelta(signedOf(backup)); });
        writeFailed(res,'删除');
      }
    });
}

function showPayrollForm(){
  const cfg=loadIncome(); const p=cfg.payroll||{};
  const freq=p.freq||'biweekly';
  const selStyle='';
  function fOpt(v,label){ return '<option value="'+v+'"'+(freq===v?' selected':'')+'>'+label+'</option>'; }
  document.getElementById('incomeFormWrap').innerHTML=
    '<div class="editform" style="border-color:var(--cash-ln)">'+
      '<div class="fld"><label>每期金额 ($) · 税后实发</label>'+
        '<input id="pay-amt" type="number" inputmode="decimal" value="'+(p.amount||'')+'" placeholder="例：2500"></div>'+
      '<div class="fld"><label>发薪频率</label>'+
        '<select id="pay-freq" style="'+selStyle+'">'+
          fOpt('weekly','每周')+fOpt('biweekly','每两周')+fOpt('monthly','每月')+
        '</select></div>'+
      '<div class="fld"><label>起始发薪日</label>'+
        '<input id="pay-start" type="date" value="'+(p.start||'')+'"></div>'+
      '<div style="font-size:11px;color:var(--ink-faint);margin-bottom:10px">保存后会从起始日按频率一次性补发到 Chase。若余额已经包含这些工资，请把起始日设为最近一次发薪日之后。</div>'+
      '<div class="btns">'+
        '<button class="cancel" onclick="document.getElementById(\'incomeFormWrap\').innerHTML=\'\'">取消</button>'+
        '<button class="save" style="background:var(--cash)" onclick="savePayroll()">保存</button>'+
      '</div></div>';
  document.getElementById('pay-amt').focus();
}
function savePayroll(){
  const amt=parseFloat(document.getElementById('pay-amt').value);
  const start=document.getElementById('pay-start').value;
  const freq=document.getElementById('pay-freq').value;
  if(!(amt>0)||!start){ alert('请填写金额和日期'); return; }
  const cfg=loadIncome();
  cfg.payroll={amount:Math.round(amt), start:start, freq:freq};
  delete cfg.paidTotal; delete cfg.lastPayDate;   // 旧版遗留字段，不再需要
  if(!saveIncome(cfg)) return;
  // 先把配置显示出来，历史工资的补记放后台跑完再刷一次。
  // 补记可能有好几个发薪日，每笔一次 Apps Script 往返（1~3 秒），
  // 挡在渲染前面会让「保存」看起来没生效、依旧显示「未设置」。
  openDetail('cash', true);
  // 每个发薪日都是 Ledger 里的一行，带 pay:日期 的 key，重复写入会被服务器拦掉
  runPayroll().then(function(){ recompute(); openDetail('cash', true); });
}
function showBonusForm(){
  document.getElementById('incomeFormWrap').innerHTML=
    '<div class="editform" style="border-color:var(--cash-ln)">'+
      '<div class="fld"><label>Bonus 金额 ($)</label>'+
        '<input id="bonus-amt" type="number" inputmode="decimal" placeholder="例：5000"></div>'+
      '<div class="btns">'+
        '<button class="cancel" onclick="document.getElementById(\'incomeFormWrap\').innerHTML=\'\'">取消</button>'+
        '<button class="save" style="background:var(--cash)" onclick="saveBonus()">入账</button>'+
      '</div></div>';
  document.getElementById('bonus-amt').focus();
}
function saveBonus(){
  const amt=parseFloat(document.getElementById('bonus-amt').value);
  if(!(amt>0)){ alert('请输入金额'); return; }
  const today=fmtD(todayD());
  const tmp={row:-Date.now(), date:today, category:'Income · Bonus',
             amount:Math.round(amt), note:'', key:''};
  applyLocal(function(){ ledgerRows.push(tmp); applyCashDelta(signedOf(tmp)); });
  openDetail('cash', true);
  apiWrite({action:'addLedger', date:today, category:'Income · Bonus', amount:Math.round(amt), note:''})
    .then(function(res){
      if(res && res.status==='success'){ tmp.row=res.row; }
      else{ applyLocal(function(){ ledgerRows=ledgerRows.filter(x=>x!==tmp); applyCashDelta(-signedOf(tmp)); });
            writeFailed(res,'Bonus 入账'); }
    });
}
function showReconcileForm(){
  const wrap=document.getElementById('incomeFormWrap');
  if(!wrap) return;
  if(wrap.innerHTML){ wrap.innerHTML=''; return; }
  const st='';
  wrap.innerHTML=
    '<div class="editform" style="border-color:var(--cash-ln)">'+
      '<div style="font-size:15px;font-weight:600;margin-bottom:4px">手动修改余额</div>'+
      '<div style="font-size:12px;color:var(--ink-faint);margin-bottom:12px">'+
        (cashInfo.anchorDate?('上次对账 '+cashInfo.anchorDate.replace(/-/g,'/')):'还没对过账')+'</div>'+
      '<div class="fld"><label>银行 App 上的真实余额 ($)</label>'+
        '<input id="rc-amt" type="number" inputmode="decimal" placeholder="例：9450" oninput="updateReconcileDiff()"></div>'+
      '<div id="rc-diff" style="font-size:12px;color:var(--ink-faint);margin-bottom:12px">输入后显示差额</div>'+
      '<div class="fld"><label>差额怎么处理</label>'+
        '<select id="rc-mode" style="'+st+'" onchange="updateReconcileDiff()">'+
          '<option value="adjust">只调余额</option>'+
          '<option value="expense">记为一笔支出</option>'+
          '<option value="income">记为一笔收入</option>'+
        '</select></div>'+
      '<div class="fld" id="rc-catwrap" style="display:none"><label>归入分类</label>'+
        '<select id="rc-cat" style="'+st+'">'+
          EXP_CATS.map(function(c){ return '<option value="'+c+'"'+(c==='Other or unexpected'?' selected':'')+'>'+c+'</option>'; }).join('')+
        '</select></div>'+
      '<div class="btns">'+
        '<button class="cancel" onclick="document.getElementById(\'incomeFormWrap\').innerHTML=\'\'">取消</button>'+
        '<button class="save" style="background:var(--cash)" onclick="submitReconcile()">确认对账</button>'+
        '<button class="save" style="background:#B86A78" onclick="recalcHistory()">重算历史</button>'+
      '</div></div>';
  document.getElementById('rc-amt').focus();
}
function updateReconcileDiff(){
  const v=parseFloat(document.getElementById('rc-amt').value);
  const el=document.getElementById('rc-diff');
  const mode=document.getElementById('rc-mode').value;
  document.getElementById('rc-catwrap').style.display=(mode==='expense')?'':'none';
  if(!isFinite(v)){ el.textContent='输入后显示差额'; el.style.color='var(--ink-faint)'; return; }
  const diff=Math.round((v-cashInfo.balance)*100)/100;
  if(Math.abs(diff)<0.005){ el.textContent='刚好对上，没有差额'; el.style.color='var(--pos)'; return; }
  el.textContent='差额 '+(diff>0?'+':'')+'$'+diff.toFixed(2)+(diff<0?'（实际比账面少）':'（实际比账面多）');
  el.style.color=diff<0?'var(--neg)':'var(--pos)';
}
function submitReconcile(){
  const v=parseFloat(document.getElementById('rc-amt').value);
  if(!isFinite(v)||v<0){ alert('请输入有效余额'); return; }
  const mode=document.getElementById('rc-mode').value;
  const cat=(mode==='expense')?document.getElementById('rc-cat').value:'Income · 调整';
  document.getElementById('incomeFormWrap').innerHTML='';
  apiWrite({action:'reconcile', balance:v, mode:mode, category:cat})
    .then(function(res){
      if(res && res.status==='success'){
        return syncStockFromSheet().then(function(){
          alert('已对账。差额 '+(res.diff>=0?'+':'')+'$'+Number(res.diff||0).toFixed(2)+
                (mode==='adjust'?'（只调了余额）':'（已补记一笔）'));
        });
      }
      alert('对账失败：'+((res&&res.message)||'未知原因'));
    });
}
function recalcHistory(){
  if(!confirm('重新扫一遍全部流水，刷新每月汇总和月末余额？\n手动改过旧账之后用。')) return;
  setSyncBadge('loading');
  apiWrite({action:'recalc'}).then(function(res){
    if(res && res.status==='success'){
      return syncStockFromSheet().then(function(){ alert('历史已重算'); });
    }
    alert('重算失败：'+((res&&res.message)||'未知原因'));
  });
}

function go(id){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.getElementById('scr-'+id).classList.add('active');
  if(id==='overview') currentDetailKey=null;
  window.scrollTo(0,0);
}

renderPropPage();

syncStockFromSheet();    // 再拉 Sheet：结算固定支出、按月对账、工资、定期转账

</script>
